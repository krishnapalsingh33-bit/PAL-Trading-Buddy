tom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(7px)}#sessionPanel{padding:0 22px 16px}.settings{padding:18px}.setting{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:14px 0;border-bottom:1px solid #eee}.setting:last-child{border:0}.setting strong{font-size:11px}.setting p{font-size:9px;color:var(--muted);max-width:630px;line-height:1.5;margin:4px 0 0}.two-shot-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.shot-slot{border:1px solid #d9d3cb;border-radius:12px;background:#faf8f4;padding:12px}.shot-title{font-size:9px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}.shot-help{font-size:8px;color:#77736e;margin-top:4px;line-height:1.4}.shot-btn{margin-top:9px;border:1px solid #cfc8bf;border-radius:8px;background:#171717;color:#fff;padding:8px 11px;font-size:8px;font-weight:800;cursor:pointer}.shot-btn:hover{background:#333}.shot-preview{margin-top:9px}.shot-preview img{display:block;width:100%;height:auto;max-height:70vh;min-height:260px;object-fit:contain;border:1px solid #d9d3ca;border-radius:10px;background:#f1eee9;cursor:zoom-in}.shot-empty{margin-top:9px;border:1px dashed #d9d3ca;border-radius:8px;background:#fff;padding:10px;text-align:center;font-size:8px;color:#77736e}.shot-remove{margin-top:7px;border:1px solid #dfb9b9;border-radius:7px;background:#fff4f4;color:#9a2328;padding:6px 8px;font-size:8px;font-weight:800;cursor:pointer}.session.locked{background:#fff;border-color:#d8d3cb}.locked-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:10px 0 8px}.summary-item{background:var(--soft);border:1px solid #ece8e2;border-radius:9px;padding:8px}.summary-item small{display:block;font-size:8px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}.summary-item b{display:block;font-size:11px;margin-top:4px}.session-actionbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:11px;padding-top:10px;border-top:1px solid #eee}.saved-chip{font-size:8px;font-weight:800;padding:4px 7px;border-radius:99px;background:#e9f4ee;color:var(--good)}.edit-help{font-size:9px;color:var(--muted);line-height:1.45}.editing-banner{margin:0 0 12px;padding:9px 11px;background:#fff8e7;border:1px solid #ead7a8;border-radius:9px;color:#765a18;font-size:9px;line-height:1.45}.image-viewer{position:fixed;inset:0;z-index:500;background:rgba(8,8,8,.88);display:none;align-items:center;justify-content:center;padding:25px}.image-viewer.show{display:flex}.image-viewer img{max-width:95vw;max-height:92vh;width:auto;height:auto;object-fit:contain;border-radius:10px;box-shadow:0 20px 70px rgba(0,0,0,.45)}.image-viewer-close{position:absolute;top:18px;right:24px;width:40px;height:40px;border:1px solid rgba(255,255,255,.25);border-radius:50%;background:rgba(0,0,0,.45);color:#fff;font-size:24px;line-height:1}.image-viewer-label{position:absolute;left:24px;top:22px;color:#fff;font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;opacity:.85}.toast{position:fixed;right:22px;bottom:20px;background:#171717;color:#fff;padding:10px 13px;border-radius:9px;font-size:10px;box-shadow:var(--shadow);z-index:600}.toast.hidden{display:none}@media(max-width:1100px){.stats{grid-template-columns:repeat(4,1fr)}.hero,.grid2,.reviewgrid{grid-template-columns:1fr}}@media(max-width:760px){.shell{grid-template-columns:1fr}.sidebar{height:auto;position:static;padding:12px}.nav{grid-template-columns:repeat(4,1fr)}.nav button{justify-content:center;padding:9px 5px}.nav button span{display:none}.rulebox,.foot{display:none}.main{padding:15px}.stats{grid-template-columns:repeat(2,1fr)}.formrow,.checks{grid-template-columns:1fr}.cell{min-height:75px}.two-shot-grid,.locked-summary{grid-template-columns:1fr}.top{align-items:flex-start}.top h2{font-size:23px}}

<body>
<div class="shell">
  <aside class="sidebar">

    <div class="nav">

    </div>
    <div class="rulebox"><div class="label">CORE RULE</div><div class="text">1 London trade<br>1 New York trade<br>A++ only<br>No-trade is valid</div></div>
    <div class="foot" id="storageStatus">Local storage active</div>
  </aside>
  <main class="main">
    <header class="top"><div><div class="eyebrow">TRADING JOURNAL · FINAL</div><h2 id="pageTitle">Dashboard</h2></div><div class="actions"><button class="iconbtn" id="todayBtn">Today</button><button class="btn primary" id="quickLog">+ Log Day</button></div></header>
    <section class="view active" id="dashboardView"></section><section class="view" id="calendarView"></section><section class="view" id="reviewView"></section><section class="view" id="settingsView"></section>
  </main>
</div>
<div class="modal hidden" id="dayModal" aria-hidden="true"><div class="backdrop" data-close></div><div class="modalcard"><div class="modalhead"><div><div class="eyebrow">DAILY RECORD</div><h3 id="modalTitle"></h3></div><button class="x" data-close>×</button></div><div class="daymeta" style="padding:0 22px"><div class="field"><div class="label">Day status</div><select id="dayStatus"><option value="auto">Auto</option><option value="observe">Observe / No Trade</option><option value="rest">Rest Day</option><option value="traded">Trading Day</option></select></div><div class="field"><div class="label">Overall emotion</div><input id="dayEmotion" placeholder="Calm, focused, impatient..."></div><div class="field full"><div class="label">Daily note</div><input id="dayNotes" placeholder="One useful observation from today"></div></div><div class="tabs"><button class="tab active" data-session="london">London</button><button class="tab" data-session="newyork">New York</button></div><div id="sessionPanel"></div><div class="modalfoot"><button class="btn" data-close>Close</button><button class="btn primary" id="saveDay" style="display:none" disabled>Save Day</button></div></div></div>
<div id="imageViewer" class="image-viewer" aria-hidden="true"><div class="image-viewer-label">Chart Screenshot · Full Size</div><button type="button" class="image-viewer-close" id="imageViewerClose">×</button><img id="imageViewerImg" alt="Full-size chart screenshot"></div>
<div class="toast hidden" id="toast"></div>
<script>
const DATA_KEY="tdt_final_data";const SETTINGS_KEY="tdt_final_settings";let db=loadJson(DATA_KEY,{}),settings={name:"",londonLimit:1,newyorkLimit:1,...loadJson(SETTINGS_KEY,{})};let selectedMonth=new Date(new Date().getFullYear(),new Date().getMonth(),1),modalDate=key(new Date()),session="london";const checks=[["liquidity","External buy/sell side taken"],["dxy","DXY aligned"],["cisd","CISD confirmed"],["premium","Premium / discount"],["target","Target + reason clear"],["fvg","FVG present"],["smt","SMT confirmation"],["ote","OTE"],["retracement","50% retracement"],["displacement","Real displacement"]];
function loadJson(k,f){try{return JSON.parse(localStorage.getItem(k))||f}catch{return f}}function save(){localStorage.setItem(DATA_KEY,JSON.stringify(db));updateStorage()}function updateStorage(){const e=document.getElementById("storageStatus");if(e)e.textContent=`Local · ${Object.keys(db).length} days saved`}function key(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}function dfrom(k){const[a,b,c]=k.split("-").map(Number);return new Date(a,b-1,c)}function monthKeys(y,m){const n=new Date(y,m+1,0).getDate();return Array.from({length:n},(_,i)=>key(new Date(y,m,i+1)))}function emptySession(){return{traded:false,direction:"",grade:"",result:"",rr:"",entry:"",stop:"",target:"",emotion:"",notes:"",pnl:"",screenshot1:"",screenshot2:"",checks:Object.fromEntries(checks.map(x=>[x[0],false]))}}function emptyDay(){return{status:"auto",dayEmotion:"",dayNotes:"",pnl:"",london:emptySession(),newyork:emptySession()}}function getDay(k){if(!db[k])db[k]=emptyDay();const e=emptyDay(),d=db[k];d.status=d.status||"auto";d.dayEmotion=d.dayEmotion||"";d.dayNotes=d.dayNotes||"";d.pnl=d.pnl||"";for(const s of ["london","newyork"]){const old=d[s]||{};d[s]={...e[s],...old,checks:{...e[s].checks,...(old.checks||{})}};if(!d[s].screenshot1&&old.screenshot)d[s].screenshot1=old.screenshot;d[s].screenshot1=d[s].screenshot1||"";d[s].screenshot2=d[s].screenshot2||""}return d}function tradeCount(k){const d=getDay(k);return[d.london,d.newyork].filter(s=>s.traded).length}function anyEntry(k){const d=getDay(k);return!!(db[k]&&(d.dayNotes||d.dayEmotion||tradeCount(k)>0||d.status!=="auto"))}function breakDay(k){const d=getDay(k);return[d.london,d.newyork].some(s=>s.grade==="Rule Break")||tradeCount(k)>2||d.status==="break"}function effectiveStatus(k){const d=getDay(k);if(breakDay(k))return"Rule Break";if(d.status==="rest")return"Rest";if(d.status==="observe")return"No Trade";if(tradeCount(k)>0)return"Trading";if(anyEntry(k))return"No Trade";return"Unlogged"}function cleanDay(k){return anyEntry(k)&&!breakDay(k)}function validSetup(s){return checks.every(x=>!!s.checks[x[0]])}function tradedOnAPlus(k){const d=getDay(k),s=[d.london,d.newyork].filter(x=>x.traded);return s.length>0&&!breakDay(k)&&s.every(x=>x.grade==="A++")&&s.every(validSetup)}function streakForMonth(keys){let c=0;for(let i=keys.length-1;i>=0;i--){if(!cleanDay(keys[i]))break;c++}return c}function stats(keys){const ss=keys.flatMap(k=>[getDay(k).london,getDay(k).newyork]),t=ss.filter(s=>s.traded),wins=t.filter(s=>s.result==="Win").length,losses=t.filter(s=>s.result==="Loss").length,be=t.filter(s=>s.result==="BE").length,pnl=t.reduce((n,s)=>n+(Number(s.pnl)||0),0),aplus=keys.filter(tradedOnAPlus).length,breaks=keys.filter(breakDay).length,noTrade=keys.filter(k=>["No Trade","Rest"].includes(effectiveStatus(k))).length,complete=t.filter(validSetup).length;return{rawTraded:t.length,wins,losses,be,pnl,aplus,breaks,noTrade,complete,streak:streakForMonth(keys)}}function esc(s){return String(s??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;")}
function stat(a,b,c){return`<div class="stat"><small>${a}</small><b>${b}</b><em>${c}</em></div>`}function progress(a,b,c){const p=c?Math.min(100,Math.round(b/c*100)):0;return`<div class="progress"><div class="meta"><span>${a}</span><b>${p}%</b></div><div class="track"><div class="fill" style="width:${p}%"></div></div></div>`}function formatMoney(n){return n===0?"0":Number(n).toLocaleString(undefined,{maximumFractionDigits:2})}function activityRow(k){const d=getDay(k),st=effectiveStatus(k),cls=st==="Rule Break"?"bad":st==="Trading"?"good":st==="Unlogged"?"neutral":"warn";return`<div class="activity-row" data-key="${k}"><div class="date">${dfrom(k).getDate()} ${dfrom(k).toLocaleDateString(undefined,{month:"short"})}</div><div><div class="title">${tradeCount(k)} trade${tradeCount(k)===1?"":"s"} · L ${d.london.traded?"✓":"—"} · NY ${d.newyork.traded?"✓":"—"}</div><div class="sub">${d.dayNotes||d.dayEmotion||st}</div></div><span class="badge ${cls}">${st}</span></div>`}
function renderDashboard(){const y=selectedMonth.getFullYear(),m=selectedMonth.getMonth(),keys=monthKeys(y,m),s=stats(keys),disc=keys.length?Math.round(keys.filter(cleanDay).length/keys.length*100):0,recent=keys.slice().reverse().filter(anyEntry).slice(0,8);document.getElementById("dashboardView").innerHTML=`<div class="hero"><div class="card"><div class="eyebrow">CURRENT FOCUS</div><h3>Protect the process.</h3><p>Record what actually happened. The journal never asks you to trade just to fill a blank day.</p><div class="focus"><b>Core rule:</b> maximum 1 London + 1 New York trade per day. A++ only. No-trade and rest days are valid.</div></div><div class="card scorecard"><div class="ring"><strong>${disc}%</strong></div><div class="scorelabel">Monthly clean-day score</div></div></div><div class="stats">${stat("Trades",s.rawTraded,`L ${keys.filter(k=>getDay(k).london.traded).length} · NY ${keys.filter(k=>getDay(k).newyork.traded).length}`)}${stat("A++ days",s.aplus,"complete checklist")}${stat("Rule breaks",s.breaks,"target: 0")}${stat("No-trade",s.noTrade,"observation is valid")}${stat("Wins",s.wins,"logged")}${stat("Net P&L",formatMoney(s.pnl),"optional field")}${stat("Clean streak",s.streak,"logged consecutive days")}</div><div class="grid2"><div class="card section"><div class="heading"><h3>Execution quality</h3><span>${selectedMonth.toLocaleDateString(undefined,{month:"long",year:"numeric"})}</span></div>${progress("A++ days",s.aplus,keys.length)}${progress("Complete model checklists",s.complete,s.rawTraded)}${progress("No rule-break days",keys.length-s.breaks,keys.length)}${progress("Journaled days",keys.filter(anyEntry).length,keys.length)}</div><div class="card section"><div class="heading"><h3>Recent activity</h3><span>Click a day to edit</span></div><div class="activity">${recent.length?recent.map(activityRow).join(""):`<div class="note">Nothing logged yet. Click “+ Log Day” to start.</div>`}</div></div></div>`;document.querySelectorAll(".activity-row[data-key]").forEach(x=>x.onclick=()=>openDay(x.dataset.key))}
function renderCalendar(){const y=selectedMonth.getFullYear(),m=selectedMonth.getMonth(),first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();let cells="";for(let i=0;i<first;i++)cells+=`<button class="cell muted"><div class="num">${new Date(y,m,0-first+i+1).getDate()}</div></button>`;for(let n=1;n<=days;n++){const k=key(new Date(y,m,n)),d=getDay(k),st=effectiveStatus(k),today=k===key(new Date());cells+=`<button class="cell ${today?"today":""}" data-key="${k}"><div class="num">${n}</div><div class="mini">${st==="Unlogged"?"":st+" · "+tradeCount(k)+" trade"+(tradeCount(k)===1?"":"s")}</div><div class="dots"><i class="dot ${d.london.traded?(d.london.grade==="Rule Break"?"r":"g"):""}"></i><i class="dot ${d.newyork.traded?(d.newyork.grade==="Rule Break"?"r":"g"):""}"></i></div><div class="mini">${esc(d.dayNotes).slice(0,34)}</div></button>`}document.getElementById("calendarView").innerHTML=`<div class="card calendar"><div class="monthbar"><div><div class="eyebrow">MONTHLY JOURNAL</div><div class="monthname">${selectedMonth.toLocaleDateString(undefined,{month:"long",year:"numeric"})}</div></div><div class="monthnav"><button class="btn" id="prev">←</button><button class="btn" id="jump">Today</button><button class="btn" id="next">→</button></div></div><div class="calgrid">${["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(x=>`<div class="weekday">${x}</div>`).join("")}${cells}</div></div>`;document.querySelectorAll(".cell[data-key]").forEach(x=>x.onclick=()=>openDay(x.dataset.key));document.getElementById("prev").onclick=()=>{selectedMonth.setMonth(selectedMonth.getMonth()-1);renderAll()};document.getElementById("next").onclick=()=>{selectedMonth.setMonth(selectedMonth.getMonth()+1);renderAll()};document.getElementById("jump").onclick=()=>{selectedMonth=new Date(new Date().getFullYear(),new Date().getMonth(),1);renderAll()}}
function line(a,b){return`<div class="line"><span>${a}</span><b>${b}</b></div>`}function renderReview(){const y=selectedMonth.getFullYear(),m=selectedMonth.getMonth(),keys=monthKeys(y,m),s=stats(keys),all=keys.flatMap(k=>[getDay(k).london,getDay(k).newyork]).filter(x=>x.traded),em={};all.forEach(x=>x.emotion&&(em[x.emotion]=(em[x.emotion]||0)+1));const top=Object.entries(em).sort((a,b)=>b[1]-a[1])[0]?.[0]||"—",weekly=[];for(let i=0;i<keys.length;i+=7){const k=keys.slice(i,i+7);weekly.push({label:`Week ${weekly.length+1}`,trades:k.reduce((n,x)=>n+tradeCount(x),0),breaks:k.filter(breakDay).length,clean:k.filter(cleanDay).length})}document.getElementById("reviewView").innerHTML=`<div class="reviewgrid"><div class="card reviewcard"><h3>Outcome</h3>${line("Wins",s.wins)}${line("Losses",s.losses)}${line("Break-even",s.be)}${line("Net P&L",formatMoney(s.pnl))}</div><div class="card reviewcard"><h3>Model adherence</h3>${line("A++ days",s.aplus)}${line("Complete checklists",s.complete)}${line("Rule breaks",s.breaks)}${line("Clean streak",s.streak)}</div><div class="card reviewcard"><h3>Psychology</h3>${line("Most logged emotion",top)}${line("No-trade/rest days",s.noTrade)}<div class="note" style="margin-top:9px">Review behavior, not just outcomes. Look for early entries, skipped confirmations, FOMO, revenge trading, fear-based exits, or taking trades outside the model.</div></div></div><div class="card reviewcard" style="margin-top:14px"><div class="heading"><h3>Weekly breakdown</h3><span>Process first</span></div>${weekly.map(w=>`<div class="line"><span>${w.label}</span><b>${w.trades} trades · ${w.breaks} breaks · ${w.clean} clean days</b></div>`).join("")}</div><div class="card reviewcard" style="margin-top:14px"><div class="heading"><h3>Monthly review</h3><span>${selectedMonth.toLocaleDateString(undefined,{month:"long",year:"numeric"})}</span></div><textarea id="monthReview" placeholder="What improved? What must not repeat? What will I focus on next month?">${esc(localStorage.getItem(`review_${y}_${m+1}`)||"")}</textarea><div style="display:flex;justify-content:flex-end;margin-top:8px"><button class="btn primary" id="saveReview">Save Review</button></div></div>`;document.getElementById("saveReview").onclick=()=>{localStorage.setItem(`review_${y}_${m+1}`,document.getElementById("monthReview").value);toast("Monthly review saved.")}}
function renderSettings(){document.getElementById("settingsView").innerHTML=`<div class="card settings"><div class="heading"><h3>Journal settings</h3><span>Local browser</span></div><div class="setting"><div><strong>Trader name</strong><p>Optional. Used only inside this local app.</p></div><input id="setName" value="${esc(settings.name)}" style="max-width:240px;border:1px solid var(--line);padding:9px;border-radius:9px"></div><div class="setting"><div><strong>London limit</strong><p>The journal is configured around one London trade.</p></div><input id="setL" type="number" min="0" max="5" value="${settings.londonLimit}" style="max-width:90px;border:1px solid var(--line);padding:9px;border-radius:9px"></div><div class="setting"><div><strong>New York limit</strong><p>The journal is configured around one New York trade.</p></div><input id="setN" type="number" min="0" max="5" value="${settings.newyorkLimit}" style="max-width:90px;border:1px solid var(--line);padding:9px;border-radius:9px"></div><div class="setting"><div><strong>Export backup</strong><p>Save your entire journal as a JSON file.</p></div><button class="btn" id="exportBtn">Export JSON</button></div><div class="setting"><div><strong>Import backup</strong><p>Restore a previously exported JSON journal.</p></div><label class="btn" style="display:inline-flex;align-items:center">Import JSON<input type="file" id="importFile" accept=".json" style="display:none"></label></div><div class="setting"><div><strong>CSV export</strong><p>Creates a month-level table for spreadsheet review.</p></div><button class="btn" id="csvBtn">Export CSV</button></div><div class="setting"><div><strong>Delete all local data</strong><p>This cannot be undone. Export a backup first.</p></div><button class="btn danger" id="resetBtn">Delete Everything</button></div><div style="display:flex;justify-content:flex-end;margin-top:14px"><button class="btn primary" id="saveSet">Save Settings</button></div></div>`;document.getElementById("saveSet").onclick=()=>{settings.name=document.getElementById("setName").value.trim();settings.londonLimit=Number(document.getElementById("setL").value)||1;settings.newyorkLimit=Number(document.getElementById("setN").value)||1;localStorage.setItem(SETTINGS_KEY,JSON.stringify(settings));toast("Settings saved.");renderAll()};document.getElementById("exportBtn").onclick=exportJSON;document.getElementById("csvBtn").onclick=exportCSV;document.getElementById("importFile").onchange=importJSON;document.getElementById("resetBtn").onclick=()=>{if(confirm("Delete ALL journal data from this browser? Export a backup first.")){db={};localStorage.removeItem(DATA_KEY);toast("Local journal reset.");renderAll()}}}
function download(name,type,content){const blob=new Blob([content],{type}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),800)}function exportJSON(){download(`trading-journal-backup-${key(new Date())}.json`,`application/json`,JSON.stringify({version:3,exportedAt:new Date().toISOString(),settings,data:db},null,2));toast("Backup exported.")}function importJSON(e){const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const p=JSON.parse(r.result);if(!p.data)throw Error();db=p.data;settings={...settings,...(p.settings||{})};save();renderAll();toast("Backup imported.")}catch{alert("Invalid Trading Discipline backup.")}};r.readAsText(f)}function exportCSV(){const keys=monthKeys(selectedMonth.getFullYear(),selectedMonth.getMonth()),rows=[["Date","Status","London Traded","London Direction","London Grade","London Result","London R","London P&L","NY Traded","NY Direction","NY Grade","NY Result","NY R","NY P&L","Day Emotion","Day Notes"]];keys.forEach(k=>{const d=getDay(k),l=d.london,n=d.newyork;rows.push([k,effectiveStatus(k),l.traded?"Yes":"No",l.direction,l.grade,l.result,l.rr,l.pnl,n.traded?"Yes":"No",n.direction,n.grade,n.result,n.rr,n.pnl,d.dayEmotion,d.dayNotes])});download(`trading-journal-${selectedMonth.getFullYear()}-${String(selectedMonth.getMonth()+1).padStart(2,"0")}.csv`,`text/csv;charset=utf-8`,rows.map(r=>r.map(v=>`"${String(v??"").replaceAll('"','""')}"`).join(",")).join("\n"));toast("CSV exported.")}
function openDay(k){window.__editingSession=null;window.__dirty=false;modalDate=k;session="london";const d=getDay(k);document.getElementById("modalTitle").textContent=dfrom(k).toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long",year:"numeric"});document.getElementById("dayStatus").value=d.status||"auto";document.getElementById("dayEmotion").value=d.dayEmotion||"";document.getElementById("dayNotes").value=d.dayNotes||"";setDirty(false);document.getElementById("dayStatus").onchange=()=>setDirty(true);document.getElementById("dayEmotion").oninput=()=>setDirty(true);document.getElementById("dayNotes").oninput=()=>setDirty(true);document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x.dataset.session==="london"));document.getElementById("dayModal").classList.remove("hidden");renderSession()}
function closeModal(){document.getElementById("dayModal").classList.add("hidden")}document.querySelectorAll("[data-close]").forEach(x=>x.onclick=closeModal);document.querySelectorAll(".tab").forEach(x=>x.onclick=()=>{session=x.dataset.session;window.__editingSession=null;document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active",t===x));renderSession()});document.getElementById("imageViewerClose").onclick=()=>{document.getElementById("imageViewer").classList.remove("show")};document.getElementById("imageViewer").onclick=e=>{if(e.target.id==="imageViewer")e.currentTarget.classList.remove("show")};
function renderSession(){const d=getDay(modalDate),s=d[session],editing=window.__editingSession===session,sessionName=session==="london"?"London":"New York";const shot=(n,data)=>`<div class="shot-card"><div class="shot-title">Chart Screenshot ${n}</div><div class="shot-help">${n===1?"Primary setup / market context":"Execution / confirmation"}</div><button type="button" class="shot-btn" id="uploadShot${n}">Upload Screenshot</button><input id="fileShot${n}" type="file" accept="image/*" hidden><div id="previewShot${n}" class="shot-preview" style="display:${data?"block":"none"}"><img id="imgShot${n}" alt="${sessionName} chart screenshot ${n}" src="${esc(data)}"><button type="button" class="shot-remove" id="removeShot${n}">Remove</button></div><div id="emptyShot${n}" class="shot-empty" style="display:${data?"none":"block"}">No screenshot attached.</div></div>`;const screenshotHTML=`<div class="two-shot-grid">${shot(1,s.screenshot1)}${shot(2,s.screenshot2)}</div>`;if(s.traded&&!editing){document.getElementById("sessionPanel").innerHTML=`<div class="session locked"><div class="sessiontitle"><h4>${sessionName} Session</h4><span class="saved-chip">SAVED</span></div><div class="locked-summary"><div class="summary-item"><small>Direction</small><b>${esc(s.direction||"—")}</b></div><div class="summary-item"><small>Grade</small><b>${esc(s.grade||"—")}</b></div><div class="summary-item"><small>Result</small><b>${esc(s.result||"—")}</b></div><div class="summary-item"><small>R multiple</small><b>${esc(s.rr||"—")}</b></div><div class="summary-item"><small>P&L</small><b>${esc(s.pnl||"0")}</b></div><div class="summary-item"><small>Emotion</small><b>${esc(s.emotion||"—")}</b></div><div class="summary-item"><small>Model</small><b>${validSetup(s)?"Complete":"Incomplete"}</b></div><div class="summary-item"><small>Entry → Target</small><b>${esc(s.entry||"—")} → ${esc(s.target||"—")}</b></div></div>${screenshotHTML}<div class="note" style="margin-top:10px">${esc(s.notes||"No trade note recorded.")}</div><div class="session-actionbar"><span class="edit-help">Saved. Press Edit session to change anything.</span><button class="btn" id="editSession">Edit session</button></div></div>`;wireScreenshots(true);document.getElementById("editSession").onclick=()=>{window.__editingSession=session;renderSession()};return}document.getElementById("sessionPanel").innerHTML=`<div class="session"><div class="sessiontitle"><h4>${sessionName} Session</h4><span>Maximum 1 trade</span></div>${editing?`<div class="editing-banner"><b>Edit mode.</b> Changes are committed when you press <b>Save Day</b>.</div>`:""}<div class="field" style="margin-bottom:11px"><div class="label">Did you trade?</div><div class="choice"><label><input type="radio" name="traded" value="yes" ${s.traded?"checked":""}><span>Yes</span></label><label><input type="radio" name="traded" value="no" ${!s.traded?"checked":""}><span>No</span></label></div></div>${s.traded?`<div class="formrow"><div class="field"><div class="label">Direction</div><select data-f="direction"><option value="">Select</option><option ${s.direction==="Buy"?"selected":""}>Buy</option><option ${s.direction==="Sell"?"selected":""}>Sell</option></select></div><div class="field"><div class="label">Setup grade</div><select data-f="grade"><option value="">Select</option><option ${s.grade==="A++"?"selected":""}>A++</option><option ${s.grade==="A+"?"selected":""}>A+</option><option ${s.grade==="B"?"selected":""}>B</option><option ${s.grade==="Rule Break"?"selected":""}>Rule Break</option></select></div><div class="field"><div class="label">Result</div><select data-f="result"><option value="">Select</option><option ${s.result==="Win"?"selected":""}>Win</option><option ${s.result==="Loss"?"selected":""}>Loss</option><option ${s.result==="BE"?"selected":""}>BE</option></select></div><div class="field"><div class="label">R multiple</div><input type="number" step=".1" data-f="rr" value="${esc(s.rr)}"></div><div class="field"><div class="label">P&L</div><input type="number" step=".01" data-f="pnl" value="${esc(s.pnl)}"></div><div class="field"><div class="label">Emotion</div><select data-f="emotion"><option value="">Select</option>${["Calm","Focused","Impatient","Fearful","Greedy","Frustrated","FOMO","Confident","Tired","Distracted"].map(v=>`<option ${s.emotion===v?"selected":""}>${v}</option>`).join("")}</select></div><div class="field"><div class="label">Entry</div><input data-f="entry" value="${esc(s.entry)}"></div><div class="field"><div class="label">Stop loss</div><input data-f="stop" value="${esc(s.stop)}"></div><div class="field"><div class="label">Target</div><input data-f="target" value="${esc(s.target)}"></div><div class="field"><div class="label">Trade note</div><input data-f="notes" value="${esc(s.notes)}"></div></div>${screenshotHTML}<div style="height:12px"></div><div class="label" style="margin-bottom:7px">A++ MODEL CHECKLIST</div><div class="checks">${checks.map(c=>`<label class="check"><input type="checkbox" data-c="${c[0]}" ${s.checks[c[0]]?"checked":""}>${c[1]}</label>`).join("")}</div><div class="note" style="margin-top:11px"><b>Checklist:</b> ${validSetup(s)?"Complete.":"Incomplete — do not call this A++ until the model conditions are actually present."}</div>`:`<div class="note">No trade recorded for ${sessionName}. This is valid. Use the day note to record what you observed.</div>`}${editing?`<div class="session-actionbar"><span class="edit-help">Edit mode is active.</span><button class="btn" id="cancelEdit">Cancel Edit</button></div>`:""}</div>`;document.querySelectorAll("[data-f]").forEach(el=>el.oninput=el.onchange=()=>{getDay(modalDate)[session][el.dataset.f]=el.value;setDirty(true)});document.querySelectorAll("[data-c]").forEach(el=>el.onchange=()=>{getDay(modalDate)[session].checks[el.dataset.c]=el.checked;setDirty(true)});document.querySelectorAll('input[name="traded"]').forEach(el=>el.onchange=()=>{if(el.value==="yes")getDay(modalDate)[session].traded=true;else getDay(modalDate)[session]=emptySession();window.__editingSession=session;setDirty(true);renderSession()});wireScreenshots(false);const cancel=document.getElementById("cancelEdit");if(cancel)cancel.onclick=()=>{db=loadJson(DATA_KEY,{});window.__editingSession=null;setDirty(false);renderSession();toast("Edit cancelled.")}}
function wireScreenshots(locked){const s=getDay(modalDate)[session],i1=document.getElementById("fileShot1"),i2=document.getElementById("fileShot2"),b1=document.getElementById("uploadShot1"),b2=document.getElementById("uploadShot2"),r1=document.getElementById("removeShot1"),r2=document.getElementById("removeShot2");const show=(n,data)=>{const p=document.getElementById(`previewShot${n}`),img=document.getElementById(`imgShot${n}`),e=document.getElementById(`emptyShot${n}`);if(!p||!img||!e)return;if(data){img.src=data;p.style.display="block";e.style.display="none"}else{img.removeAttribute("src");p.style.display="none";e.style.display="block"}};show(1,s.screenshot1);show(2,s.screenshot2);if(locked){const a=document.getElementById("imgShot1"),b=document.getElementById("imgShot2");if(a)a.onclick=()=>openImageViewer(a.src);if(b)b.onclick=()=>openImageViewer(b.src);return}if(b1)b1.onclick=()=>i1.click();if(b2)b2.onclick=()=>i2.click();const read=(n,f)=>{if(!f)return;if(!f.type.startsWith("image/")){toast("Please select an image.");return}const r=new FileReader();r.onload=()=>{const data=String(r.result||"");s[n===1?"screenshot1":"screenshot2"]=data;show(n,data);setDirty(true);toast(`Screenshot ${n} added.`)};r.onerror=()=>toast("Could not read the image.");r.readAsDataURL(f)};if(i1)i1.onchange=e=>read(1,e.target.files&&e.target.files[0]);if(i2)i2.onchange=e=>read(2,e.target.files&&e.target.files[0]);if(r1)r1.onclick=()=>{s.screenshot1="";i1.value="";show(1,"");setDirty(true)};if(r2)r2.onclick=()=>{s.screenshot2="";i2.value="";show(2,"");setDirty(true)}}function openImageViewer(src){if(!src)return;document.getElementById("imageViewerImg").src=src;document.getElementById("imageViewer").classList.add("show")}
function setDirty(v){window.__dirty=!!v;const b=document.getElementById("saveDay");if(b){b.style.display=window.__dirty?"inline-block":"none";b.disabled=!window.__dirty}}document.getElementById("saveDay").onclick=()=>{const d=getDay(modalDate);d.status=document.getElementById("dayStatus").value;d.dayEmotion=document.getElementById("dayEmotion").value.trim();d.dayNotes=document.getElementById("dayNotes").value.trim();if(d.status==="auto")d.status=breakDay(modalDate)?"break":tradeCount(modalDate)>0?"traded":d.dayNotes||d.dayEmotion?"observe":"auto";save();window.__editingSession=null;setDirty(false);closeModal();renderAll();toast("Day saved.")};function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.remove("hidden");clearTimeout(window.__toast);window.__toast=setTimeout(()=>t.classList.add("hidden"),2200)}function renderAll(){renderDashboard();renderCalendar();renderReview();renderSettings();updateStorage()}function nav(v){document.querySelectorAll(".view").forEach(x=>x.classList.remove("active"));document.getElementById(v+"View").classList.add("active");document.querySelectorAll(".nav button").forEach(x=>x.classList.toggle("active",x.dataset.view===v));document.getElementById("pageTitle").textContent={dashboard:"Dashboard",calendar:"Month",review:"Review",settings:"Settings"}[v]}document.querySelectorAll(".nav button").forEach(b=>b.addEventListener("click",()=>nav(b.dataset.view)));document.getElementById("todayBtn").onclick=()=>{selectedMonth=new Date(new Date().getFullYear(),new Date().getMonth(),1);nav("calendar");openDay(key(new Date()))};document.getElementById("quickLog").onclick=()=>openDay(key(new Date()));document.addEventListener("keydown",e=>{if(e.key==="Escape"){document.getElementById("imageViewer").classList.remove("show");closeModal()}});renderAll();
</script>
