<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trading Discipline Tracker v2</title>
<style>
:root{--bg:#f4f2ef;--panel:#fff;--ink:#171717;--muted:#777;--line:#e3ded7;--accent:#8f1d22;--good:#176b43;--bad:#9a2328;--warn:#9a6710;--shadow:0 12px 30px rgba(0,0,0,.07);--r:16px}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}.app{min-height:100vh;display:grid;grid-template-columns:240px 1fr}.side{background:#151515;color:#fff;padding:20px;display:flex;flex-direction:column}.brand{display:flex;gap:10px;align-items:center;margin-bottom:24px}.logo{width:40px;height:40px;border-radius:12px;background:#fff;color:#111;display:grid;place-items:center;font-weight:900}.brand b{font-size:14px}.brand small{display:block;color:#999;font-size:9px;margin-top:3px}.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;color:#aaa;text-align:left;padding:11px;border-radius:10px;font-size:11px}.nav button.active,.nav button:hover{background:#292929;color:#fff}.sidefoot{margin-top:auto;font-size:9px;color:#686868}.main{padding:26px 30px 44px}.head{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-bottom:18px}.eyebrow{font-size:9px;letter-spacing:.15em;font-weight:800;color:var(--muted)}h1{font-size:27px;margin:5px 0 0}.actions{display:flex;gap:8px}.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 13px;font-size:10px;font-weight:800}.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(0,0,0,.08)}.view{display:none}.view.on{display:block}.hero{display:grid;grid-template-columns:1.3fr .7fr;gap:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}.hero h2{font-size:20px;margin:4px 0 7px}.hero p,.muted{color:var(--muted);font-size:11px;line-height:1.6}.score{text-align:center;display:grid;place-items:center}.ring{width:106px;height:106px;border:10px solid #ece9e4;border-radius:50%;display:grid;place-items:center;position:relative}.ring:after{content:"";position:absolute;inset:-10px;border-radius:50%;border:10px solid transparent;border-top-color:var(--accent);transform:rotate(15deg)}.ring b{font-size:26px}.stats{display:grid;grid-template-columns:repeat(7,1fr);gap:9px;margin:14px 0}.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px;box-shadow:var(--shadow)}.stat small{text-transform:uppercase;letter-spacing:.08em;font-size:8px;color:var(--muted)}.stat b{display:block;font-size:20px;margin-top:6px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.cardtitle{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.cardtitle b{font-size:12px}.pill{font-size:8px;padding:4px 7px;border-radius:99px;background:#eceae6;color:#666}.activity{display:grid;gap:7px;max-height:330px;overflow:auto}.row{display:grid;grid-template-columns:52px 1fr auto;gap:8px;align-items:center;padding:9px;border:1px solid #ece9e4;background:#faf9f6;border-radius:10px}.row b{font-size:10px}.row small{font-size:9px;color:var(--muted)}.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.dow{font-size:8px;color:var(--muted);padding:4px}.day{min-height:96px;border:1px solid var(--line);background:#faf9f6;border-radius:10px;padding:7px;cursor:pointer}.day:hover{border-color:#aaa}.day.today{outline:2px solid var(--accent);outline-offset:-2px}.daynum{font-size:10px;font-weight:900}.mini{font-size:8px;color:var(--muted);margin-top:5px;line-height:1.5}.dots{display:flex;gap:4px;margin-top:6px}.dot{width:7px;height:7px;border-radius:50%;background:#d6d2ca}.dot.g{background:var(--good)}.dot.r{background:var(--bad)}.dot.w{background:var(--warn)}.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(8,8,8,.58);backdrop-filter:blur(4px);z-index:50}.modal.on{display:flex}.modalbox{width:min(1120px,calc(100vw - 24px));max-height:calc(100vh - 24px);overflow:auto;background:#fff;border-radius:18px;box-shadow:0 30px 90px rgba(0,0,0,.32)}.mh{display:flex;justify-content:space-between;align-items:flex-start;padding:18px 22px 8px;position:sticky;top:0;background:rgba(255,255,255,.97);z-index:2;border-bottom:1px solid #eee}.mh h2{margin:2px 0;font-size:19px}.close{border:0;background:transparent;font-size:25px;color:#777}.tabs{display:flex;gap:6px;padding:10px 22px}.tab{border:1px solid var(--line);background:#fff;border-radius:99px;padding:8px 13px;font-size:10px;font-weight:900}.tab.on{background:#171717;color:#fff}.session{padding:0 22px 18px}.toolbar{display:flex;justify-content:space-between;align-items:center;padding:8px 0 12px}.trade-list{display:grid;gap:12px}.trade{border:1px solid #e5dfd7;border-radius:14px;background:#fbfaf8;padding:14px}.tradehead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.tradehead b{font-size:12px}.tradehead small{font-size:8px;color:var(--muted)}.form{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.field{display:grid;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:8px;font-weight:900;text-transform:uppercase;letter-spacing:.07em;color:#5c5852}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px;outline:none}.field textarea{min-height:72px;resize:vertical}.checks{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}.check{display:flex;gap:7px;align-items:center;padding:8px;border:1px solid var(--line);background:#fff;border-radius:9px;font-size:8px}.shots{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.shot{border:1px dashed #cfc8bf;border-radius:10px;padding:10px;background:#fff}.shot b{font-size:8px;text-transform:uppercase;letter-spacing:.06em}.shot p{margin:4px 0;font-size:8px;color:var(--muted)}.shot input{font-size:9px}.preview{margin-top:7px}.preview img{width:100%;max-height:330px;object-fit:contain;border:1px solid #ddd;border-radius:8px;background:#f2efe9;cursor:zoom-in}.mfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 22px;position:sticky;bottom:0;background:rgba(255,255,255,.97);border-top:1px solid #eee}.danger{color:var(--bad);background:#fff4f4}.toast{position:fixed;right:20px;bottom:18px;background:#171717;color:#fff;padding:10px 13px;border-radius:9px;font-size:9px;z-index:100}.toast.off{display:none}.fade{animation:fade .22s ease}@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media(max-width:1150px){.stats{grid-template-columns:repeat(4,1fr)}.hero,.grid2{grid-template-columns:1fr}.form{grid-template-columns:repeat(2,1fr)}}@media(max-width:750px){.app{grid-template-columns:1fr}.side{padding:12px}.nav{grid-template-columns:repeat(4,1fr)}.nav button{text-align:center}.sidefoot{display:none}.main{padding:15px}.stats{grid-template-columns:repeat(2,1fr)}.form,.checks,.shots{grid-template-columns:1fr}.day{min-height:75px}}
</style></head>
<body><div class="app"><aside class="side"><div class="brand"><div class="logo">TD</div><div><b>Trading Discipline</b><small>V2 • JOURNAL</small></div></div><div class="nav"><button class="active" data-view="dash">▦ Dashboard</button><button data-view="month">◫ Month</button><button data-view="review">◌ Review</button><button data-view="settings">⚙ Settings</button></div><div class="sidefoot">Your journal. Your rules. Your data.</div></aside><main class="main"><div class="head"><div><div class="eyebrow">TRADING DISCIPLINE TRACKER</div><h1 id="title">Dashboard</h1></div><div class="actions"><button class="btn" id="backupBtn">Backup</button><button class="btn primary" id="newBtn">+ New Journal Day</button></div></div>
<section id="dash" class="view on"></section><section id="month" class="view"></section><section id="review" class="view"></section><section id="settings" class="view"></section></main></div>
<div class="modal" id="modal"><div class="modalbox"><div class="mh"><div><div class="eyebrow">DAILY JOURNAL</div><h2 id="modalTitle">Date</h2></div><button class="close" id="close">×</button></div><div class="tabs"><button class="tab on" data-s="london">London</button><button class="tab" data-s="newyork">New York</button></div><div class="session"><div class="toolbar"><div class="muted" id="sessionSummary">Up to 2 trades • 2 screenshots per trade</div><button class="btn" id="addTrade">+ Add Trade</button></div><div id="trades" class="trade-list"></div></div><div class="mfoot"><button class="btn danger" id="deleteDay">Delete Day</button><div><button class="btn" id="cancel">Cancel</button><button class="btn primary" id="save">Save Changes</button></div></div></div></div><div class="modal" id="viewer"><button class="close" id="viewerClose" style="position:absolute;top:18px;right:24px;color:#fff;z-index:2">×</button><img id="viewerImg" style="max-width:94vw;max-height:92vh;border-radius:10px"></div><div class="toast off" id="toast"></div>
<script>
const KEY='tdt_v2_local_fallback';const OLD_KEYS=['tdt_final_data','tdt_data','tradingDisciplineTracker'];
let state={version:2,days:{}};let currentDate=null,currentSession='london';let dirty=false;
const $=s=>document.querySelector(s);const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function blankTrade(){return {direction:'',setup:'',result:'',r:'',pnl:'',emotion:'',entry:'',sl:'',tp:'',note:'',checks:[],shot1:'',shot2:''}}
function blankDay(date){return {date,status:'Planned',emotion:'',note:'',sessions:{london:{trades:[]},newyork:{trades:[]}}}}
function normalize(){if(!state.days||typeof state.days!=='object')state.days={};for(const [d,x] of Object.entries(state.days)){x.sessions??={};for(const s of ['london','newyork']){x.sessions[s]??={trades:[]};if(!Array.isArray(x.sessions[s].trades))x.sessions[s].trades=[];x.sessions[s].trades=x.sessions[s].trades.map(t=>({...blankTrade(),...t,checks:Array.isArray(t.checks)?t.checks:[]}))}}}
function legacyMigration(){let candidate=null;for(const k of OLD_KEYS){try{const raw=localStorage.getItem(k);if(raw){candidate=JSON.parse(raw);break}}catch(_){} }if(candidate){const days=candidate.days||candidate.records||candidate;if(days&&typeof days==='object'){for(const [d,x] of Object.entries(days)){if(!state.days[d]){const day=blankDay(d);if(x&&typeof x==='object'){day.status=x.status||day.status;day.emotion=x.emotion||'';day.note=x.note||'';const map=[['london','london'],['newyork','newyork'],['ny','newyork']];for(const [a,b] of map)if(x[a]){const t=x[a].trade||x[a];if(t&&typeof t==='object'&&Object.keys(t).length){day.sessions[b].trades=[{...blankTrade(),...t}]}}}state.days[d]=day}}}}}}
async function load(){try{if(window.tdt?.db){const remote=await window.tdt.db.load();if(remote?.days&&Object.keys(remote.days).length)state={version:2,days:remote.days};else {const raw=localStorage.getItem(KEY);if(raw)state=JSON.parse(raw);legacyMigration();await window.tdt.db.save(state)}}else{const raw=localStorage.getItem(KEY);if(raw)state=JSON.parse(raw);legacyMigration()}}catch(e){try{const raw=localStorage.getItem(KEY);if(raw)state=JSON.parse(raw)}catch(_){} }normalize();renderAll()}
async function persist(){normalize();localStorage.setItem(KEY,JSON.stringify(state));if(window.tdt?.db){await window.tdt.db.save(state)}dirty=false;toast('Saved safely');renderAll()}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.remove('off');setTimeout(()=>t.classList.add('off'),1800)}
function fmtMoney(v){const n=Number(v);return Number.isFinite(n)?n.toFixed(2):'—'}
function allTrades(){return Object.values(state.days).flatMap(d=>['london','newyork'].flatMap(s=>d.sessions[s].trades.map(t=>({...t,date:d.date,session:s}))));}
function stats(){const ts=allTrades();const pnl=ts.reduce((a,t)=>a+(Number(t.pnl)||0),0);const wins=ts.filter(t=>String(t.result).toLowerCase()==='win').length;const losses=ts.filter(t=>String(t.result).toLowerCase()==='loss').length;const rr=ts.reduce((a,t)=>a+(Number(t.r)||0),0);const discipline=ts.length?Math.round(ts.reduce((a,t)=>a+(t.checks.length>=5?1:0),0)/ts.length*100):0;return {days:Object.keys(state.days).length,trades:ts.length,pnl,wins,losses,rr,discipline};}
function dash(){const s=stats();const days=Object.values(state.days).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,8);$('#dash').innerHTML=`<div class="hero"><div class="card fade"><div class="eyebrow">EXECUTION OVER EMOTION</div><h2>Stay patient. Take only your model.</h2><p>Two sessions per day, up to two trades per session. Every trade keeps its own execution details, checklist and two screenshots.</p><p class="muted">Persistence: ${window.tdt?.db?'SQLite + automatic backups':'local fallback'}.</p></div><div class="card score fade"><div class="ring"><b>${s.discipline}%</b></div><div class="muted">Checklist discipline</div></div></div><div class="stats">${[['Days',s.days,'Journal'],['Trades',s.trades,'All sessions'],['Wins',s.wins,'Closed'],['Losses',s.losses,'Closed'],['P&L',fmtMoney(s.pnl),'Net'],['Net R',s.rr.toFixed(2),'R multiple'],['Discipline',s.discipline+'%','Checklist']].map(x=>`<div class="stat fade"><small>${x[0]}</small><b>${x[1]}</b><em>${x[2]}</em></div>`).join('')}</div><div class="grid2"><div class="card"><div class="cardtitle"><b>Recent journal activity</b><span class="pill">Latest 8 days</span></div><div class="activity">${days.length?days.map(d=>{const ts=['london','newyork'].flatMap(s=>d.sessions[s].trades);const p=ts.reduce((a,t)=>a+(Number(t.pnl)||0),0);return `<div class="row" data-open="${d.date}"><b>${d.date.slice(5)}</b><div><b>${ts.length} trade(s)</b><br><small>${d.status} • ${d.emotion||'Emotion not set'}</small></div><b class="${p>0?'good':p<0?'bad':'warn'}">${fmtMoney(p)}</b></div>`}).join(''):'<div class="muted">No journal days yet.</div>'}</div></div><div class="card"><div class="cardtitle"><b>Execution focus</b><span class="pill">Today</span></div><div class="muted">Your model remains the gate: external liquidity → DXY alignment → CISD close → premium/discount → target + reason. Use the trade checklist before pressing the button.</div><div style="margin-top:14px;padding:12px;border-left:3px solid var(--accent);font-size:10px;line-height:1.6">One disciplined trade beats multiple emotional trades.</div></div></div>`;document.querySelectorAll('[data-open]').forEach(x=>x.onclick=()=>openDay(x.dataset.open))}
function month(){const now=new Date();const y=month.y??now.getFullYear(),m=month.m??now.getMonth();const first=new Date(y,m,1),days=new Date(y,m+1,0).getDate(),start=(first.getDay()+6)%7;let h='<div class="card"><div class="cardtitle"><b>'+new Date(y,m,1).toLocaleString(undefined,{month:'long',year:'numeric'})+'</b><div class="actions"><button class="btn" id="pm">←</button><button class="btn" id="tm">Today</button><button class="btn" id="nm">→</button></div></div><div class="calendar">'+['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<div class="dow">${d}</div>`).join('');for(let i=0;i<start;i++)h+='<div></div>';for(let d=1;d<=days;d++){const key=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,v=state.days[key],ts=v?['london','newyork'].flatMap(s=>v.sessions[s].trades):[];h+=`<div class="day" data-day="${key}"><div class="daynum">${d}</div><div class="mini">${v?esc(v.status):'No journal'}</div><div class="dots">${ts.slice(0,4).map(t=>`<span class="dot ${String(t.result).toLowerCase()==='win'?'g':String(t.result).toLowerCase()==='loss'?'r':'w'}"></span>`).join('')}</div></div>`}h+='</div></div>';$('#month').innerHTML=h;$('#pm').onclick=()=>{month.m=m-1;month.y=y;month()};$('#nm').onclick=()=>{month.m=m+1;month.y=y;month()};$('#tm').onclick=()=>{month.y=now.getFullYear();month.m=now.getMonth();month()};document.querySelectorAll('[data-day]').forEach(x=>x.onclick=()=>openDay(x.dataset.day))}
function review(){const s=stats();const ts=allTrades();const best=[...ts].sort((a,b)=>(Number(b.r)||0)-(Number(a.r)||0))[0];const worst=[...ts].sort((a,b)=>(Number(a.r)||0)-(Number(b.r)||0))[0];$('#review').innerHTML=`<div class="grid2"><div class="card"><div class="cardtitle"><b>Performance snapshot</b><span class="pill">All journal</span></div><div class="row"><b>Net P&L</b><b>${fmtMoney(s.pnl)}</b></div><div class="row"><b>Net R</b><b>${s.rr.toFixed(2)}</b></div><div class="row"><b>Win rate</b><b>${s.wins+s.losses?Math.round(s.wins/(s.wins+s.losses)*100):0}%</b></div><div class="row"><b>Trades</b><b>${s.trades}</b></div></div><div class="card"><div class="cardtitle"><b>Trade extremes</b><span class="pill">R multiple</span></div><div class="row"><div><b>Best</b><br><small>${best?best.date+' • '+best.session:'—'}</small></div><b class="good">${best?Number(best.r||0).toFixed(2):'—'}</b></div><div class="row"><div><b>Worst</b><br><small>${worst?worst.date+' • '+worst.session:'—'}</small></div><b class="bad">${worst?Number(worst.r||0).toFixed(2):'—'}</b></div></div></div><div class="card" style="margin-top:14px"><div class="cardtitle"><b>Journal principle</b></div><div class="muted">Review process before outcome. Grade the execution, not just the P&L. Screenshot 1 records context; Screenshot 2 records execution/confirmation.</div></div>`}
function settings(){let status={};$('#settings').innerHTML=`<div class="card"><div class="cardtitle"><b>Data & safety</b></div><div class="row"><div><b>Storage</b><br><small>${window.tdt?.db?'SQLite database + local fallback':'Local browser storage'}</small></div><span class="pill">v2</span></div><div class="row"><div><b>Backup</b><br><small>Automatic database backup on each save and on exit.</small></div><button class="btn" id="doBackup">Create backup</button></div><div class="row"><div><b>Export</b><br><small>Download a portable JSON copy of your complete journal.</small></div><button class="btn" id="doExport">Export JSON</button></div></div>`;$('#doBackup').onclick=async()=>{if(window.tdt?.db)toast('Backup: '+(await window.tdt.db.backup()));else toast('Local backup already active');};$('#doExport').onclick=async()=>{if(window.tdt?.db){const r=await window.tdt.db.exportJson();toast(r.canceled?'Export cancelled':'Exported safely')}else{const a=document.createElement('a');a.href='data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(state,null,2));a.download='TradingDisciplineTracker-backup.json';a.click();toast('Exported safely')}}}
function renderAll(){dash();month();review();settings()}
function switchView(v){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===v));document.querySelectorAll('.view').forEach(s=>s.classList.remove('on'));$('#'+v).classList.add('on');$('#title').textContent=v[0].toUpperCase()+v.slice(1);if(v==='month')month();if(v==='review')review();if(v==='settings')settings();if(v==='dash')dash()}
function openDay(date){currentDate=date;if(!state.days[date])state.days[date]=blankDay(date);currentSession='london';dirty=false;$('#modalTitle').textContent=date;$('#modal').classList.add('on');renderTrades()}
function renderTrades(){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.s===currentSession));const trades=state.days[currentDate].sessions[currentSession].trades;$('#trades').innerHTML=trades.length?trades.map((t,i)=>tradeHtml(t,i)).join(''):`<div class="muted" style="padding:20px;text-align:center;border:1px dashed #ddd;border-radius:10px">No trades in ${currentSession==='london'?'London':'New York'} yet. Add Trade to create one.</div>`;wireTradeEvents()}
const checkNames=['External buy/sell side taken','DXY aligned','CISD candle closed','Premium / discount','Target + reason','FVG','SMT','OTE','50% retracement','Real displacement'];
function tradeHtml(t,i){return `<article class="trade fade"><div class="tradehead"><b>${currentSession==='london'?'London':'New York'} • Trade ${i+1}</b><small>2 independent screenshots</small></div><div class="form"><div class="field"><label>Direction</label><select data-k="direction"><option value="">—</option><option ${t.direction==='Buy'?'selected':''}>Buy</option><option ${t.direction==='Sell'?'selected':''}>Sell</option></select></div><div class="field"><label>Setup grade</label><select data-k="setup"><option value="">—</option><option ${t.setup==='A++'?'selected':''}>A++</option><option ${t.setup==='A+'?'selected':''}>A+</option><option ${t.setup==='B'?'selected':''}>B</option><option ${t.setup==='C'?'selected':''}>C</option></select></div><div class="field"><label>Result</label><select data-k="result"><option value="">—</option><option ${t.result==='Win'?'selected':''}>Win</option><option ${t.result==='Loss'?'selected':''}>Loss</option><option ${t.result==='BE'?'selected':''}>BE</option></select></div><div class="field"><label>Emotion</label><input data-k="emotion" value="${esc(t.emotion)}" placeholder="Calm / rushed..."></div><div class="field"><label>R multiple</label><input data-k="r" type="number" step="0.01" value="${esc(t.r)}"></div><div class="field"><label>P&L</label><input data-k="pnl" type="number" step="0.01" value="${esc(t.pnl)}"></div><div class="field"><label>Entry</label><input data-k="entry" value="${esc(t.entry)}"></div><div class="field"><label>Stop loss</label><input data-k="sl" value="${esc(t.sl)}"></div><div class="field"><label>Target</label><input data-k="tp" value="${esc(t.tp)}"></div><div class="field full"><label>Trade note</label><textarea data-k="note" placeholder="Why this trade? What happened?">${esc(t.note)}</textarea></div><div class="field full"><label>A++ checklist</label><div class="checks">${checkNames.map((c,j)=>`<label class="check"><input type="checkbox" data-check="${j}" ${t.checks.includes(c)?'checked':''}>${c}</label>`).join('')}</div></div></div><div class="shots"><div class="shot"><b>Screenshot 1 — context</b><p>Primary setup / market context</p><input type="file" accept="image/*" data-shot="shot1"><div class="preview">${t.shot1?`<img src="${t.shot1}" data-viewimg="${t.shot1}">`:''}</div></div><div class="shot"><b>Screenshot 2 — execution</b><p>Execution / confirmation</p><input type="file" accept="image/*" data-shot="shot2"><div class="preview">${t.shot2?`<img src="${t.shot2}" data-viewimg="${t.shot2}">`:''}</div></div></div><div style="display:flex;justify-content:flex-end;margin-top:10px"><button class="btn danger removeTrade">Remove trade</button></div></article>`}
function wireTradeEvents(){document.querySelectorAll('.trade').forEach((el,i)=>{el.querySelectorAll('[data-k]').forEach(inp=>inp.oninput=()=>{state.days[currentDate].sessions[currentSession].trades[i][inp.dataset.k]=inp.value;dirty=true});el.querySelectorAll('[data-check]').forEach(inp=>inp.onchange=()=>{const t=state.days[currentDate].sessions[currentSession].trades[i];const n=checkNames[Number(inp.dataset.check)];t.checks=inp.checked?[...new Set([...t.checks,n])]:t.checks.filter(x=>x!==n);dirty=true});el.querySelectorAll('[data-shot]').forEach(inp=>inp.onchange=e=>{const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{state.days[currentDate].sessions[currentSession].trades[i][e.target.dataset.shot]=r.result;dirty=true;renderTrades()};r.readAsDataURL(f)});el.querySelector('.removeTrade').onclick=()=>{state.days[currentDate].sessions[currentSession].trades.splice(i,1);dirty=true;renderTrades()};el.querySelectorAll('[data-viewimg]').forEach(im=>im.onclick=()=>{ $('#viewerImg').src=im.dataset.viewimg;$('#viewer').classList.add('on')})})}
$('#newBtn').onclick=()=>openDay(new Date().toISOString().slice(0,10));$('#backupBtn').onclick=async()=>{if(window.tdt?.db)toast('Backup: '+(await window.tdt.db.backup()));else toast('Local copy active')};$('#close').onclick=()=>{if(dirty&&!confirm('Discard unsaved changes?'))return;$('#modal').classList.remove('on')};$('#cancel').onclick=()=>{if(dirty&&!confirm('Discard unsaved changes?'))return;$('#modal').classList.remove('on')};$('#save').onclick=()=>persist();$('#deleteDay').onclick=()=>{if(confirm('Delete this journal day permanently?')){delete state.days[currentDate];persist();$('#modal').classList.remove('on')}};$('#addTrade').onclick=()=>{const a=state.days[currentDate].sessions[currentSession].trades;if(a.length>=2){toast('Maximum 2 trades per session');return}a.push(blankTrade());dirty=true;renderTrades()};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{currentSession=b.dataset.s;renderTrades()});document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>switchView(b.dataset.view));$('#viewerClose').onclick=()=>$('#viewer').classList.remove('on');
load();
</script></body></html>
