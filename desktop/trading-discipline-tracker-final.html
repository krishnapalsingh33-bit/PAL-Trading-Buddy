<div class="app"><aside class="side"><div class="brand"><div class="logo">TD</div><div><b>Trading Discipline</b><small>Premium Journal</small></div></div><nav class="nav"><button class="active" data-page="dashboard">Dashboard</button><button data-page="calendar">Month</button><button data-page="review">Review</button><button data-page="settings">Settings</button></nav><div class="rules"><small>Core rule</small><p>1 London trade<br>1 New York trade<br>A++ only<br>No-trade is valid</p></div><div class="status" id="status">Loading…</div></aside><main class="main"><header class="top"><div><div class="eyebrow">TRADING DISCIPLINE TRACKER · V2.1</div><h1 id="title">Dashboard</h1></div><div class="actions"><button class="btn" id="backup">Backup</button><button class="btn primary" id="newDay">+ New Journal Day</button></div></header><section id="dashboard" class="view on"></section><section id="calendar" class="view"></section><section id="review" class="view"></section><section id="settings" class="view"></section></main></div>
<div class="modal" id="dayModal"><div class="modalcard"><div class="modalhead"><div><div class="eyebrow">DAILY RECORD</div><h2 id="modalTitle"></h2></div><button class="x" id="closeDay">×</button></div><div class="dayfields"><div class="field"><div class="label">Day status</div><select id="dayStatus"><option value="auto">Auto</option><option value="observe">Observe / No Trade</option><option value="rest">Rest Day</option><option value="traded">Trading Day</option></select></div><div class="field"><div class="label">Overall emotion</div><input id="dayEmotion" placeholder="Calm, focused, impatient…"></div><div class="field full"><div class="label">Daily note</div><textarea id="dayNote" placeholder="One useful observation from today"></textarea></div></div><div class="tabs"><button class="tab active" data-session="london">London</button><button class="tab" data-session="newyork">New York</button></div><div id="sessionPanel"></div><div class="footbar"><button class="btn danger" id="deleteDay">Delete Day</button><button class="btn" id="cancelDay">Cancel</button><button class="btn primary" id="saveDay" style="display:none">Save Changes</button></div></div></div>
<div class="fulltrade" id="fullTrade"><div class="fullhead"><div><div class="eyebrow">TRADE DETAIL</div><h2 id="fullTitle"></h2></div><button class="btn" id="closeFull">Back to Journal</button></div><div class="fullbody" id="fullBody"></div></div><div class="viewer" id="viewer"><button class="btn" id="closeViewer">Close</button><img id="viewerImg" alt="Chart screenshot"></div><div class="toast hidden" id="toast"></div>
<script>
const CHECKS=[['liquidity','External liquidity taken'],['dxy','DXY aligned'],['htf','HTF bias aligned'],['pd','Discount / premium correct'],['cisd','CISD candle closed'],['disp','Real displacement'],['entry','Entry in FVG / OTE'],['target','Clear target'],['risk','Risk respected'],['emotion','No emotional entry']];
let journal={version:2,days:{}},monthCursor=new Date(new Date().getFullYear(),new Date().getMonth(),1),currentDate=null,currentSession='london',editing=false,dirty=false;
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];const key=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,dateObj=k=>{const[a,b,c]=k.split('-').map(Number);return new Date(a,b-1,c)},today=()=>key(new Date()),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const blankTrade=()=>({direction:'',setup:'',result:'',emotion:'',r:'',pnl:'',entry:'',sl:'',tp:'',note:'',checks:{},shot1:null,shot2:null}),blankSession=()=>({traded:false,trade:blankTrade()}),blankDay=d=>({date:d,status:'auto',emotion:'',note:'',london:blankSession(),newyork:blankSession()});
function normTrade(t){const x={...blankTrade(),...(t||{})};x.checks=Array.isArray(x.checks)?Object.fromEntries(x.checks.map(v=>[String(v),true])):(x.checks&&typeof x.checks==='object'?x.checks:{});x.r=x.r??x.rr??'';x.note=x.note??x.notes??'';x.shot1=x.shot1||x.screenshot1||null;x.shot2=x.shot2||x.screenshot2||null;return x}function normSession(x){if(!x)return blankSession();if(Array.isArray(x.trades))return{traded:x.trades.length>0,trade:normTrade(x.trades[0])};return{...blankSession(),...(x||{}),traded:x.traded??!!x.trade,trade:normTrade(x.trade||x)}}function normalize(raw){const src=raw?.days&&typeof raw.days==='object'?raw.days:raw||{},days={};for(const[d,v]of Object.entries(src)){if(!/^\d{4}-\d{2}-\d{2}$/.test(d))continue;const b=blankDay(d),x={...b,...(v||{})};x.emotion=x.emotion||x.dayEmotion||'';x.note=x.note||x.dayNotes||'';x.london=normSession(v?.london??v?.sessions?.london);x.newyork=normSession(v?.newyork??v?.ny??v?.sessions?.newyork);days[d]=x}return{version:2,createdAt:raw?.createdAt||new Date().toISOString(),updatedAt:new Date().toISOString(),days}}
async function load(){try{journal=normalize(await window.tdt.db.load());renderAll();const s=await window.tdt.db.status();$('#status').innerHTML=`${s.dayCount} journal day${s.dayCount===1?'':'s'} saved<br>${s.backupCount} backup${s.backupCount===1?'':'s'} available`}catch(e){$('#dashboard').innerHTML=`<div class="card"><h2>Journal could not load</h2><p class="muted">${esc(e.message||'Unknown error')}</p><p class="muted">Your existing journal file was not modified.</p></div>`;$('#status').textContent='Storage error'}}
async function persist(){journal.updatedAt=new Date().toISOString();journal=normalize(await window.tdt.db.save(journal));dirty=false;$('#saveDay').style.display='none';renderAll();loadStatus();toast('Journal saved safely.')}
async function loadStatus(){try{const s=await window.tdt.db.status();$('#status').innerHTML=`${s.dayCount} journal day${s.dayCount===1?'':'s'} saved<br>${s.backupCount} backup${s.backupCount===1?'':'s'} available`}catch{}}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.add('hidden'),1900)}function allTrades(){return Object.values(journal.days).flatMap(d=>[d.london,d.newyork].filter(s=>s.traded).map(s=>({...s.trade,date:d.date})))}function monthStats(){const y=monthCursor.getFullYear(),m=monthCursor.getMonth(),n=new Date(y,m+1,0).getDate(),keys=Array.from({length:n},(_,i)=>key(new Date(y,m,i+1))),days=keys.map(k=>journal.days[k]).filter(Boolean),trades=days.flatMap(d=>[d.london,d.newyork]).filter(s=>s.traded).map(s=>s.trade),wins=trades.filter(t=>t.result==='Win').length,losses=trades.filter(t=>t.result==='Loss').length,rr=trades.reduce((n,t)=>n+(Number(t.r)||0),0),pnl=trades.reduce((n,t)=>n+(Number(t.pnl)||0),0),aplus=days.filter(d=>[d.london,d.newyork].some(s=>s.traded&&s.trade.setup==='A++'&&valid(s.trade))).length,breaks=days.filter(d=>d.status==='break'||[d.london,d.newyork].some(s=>s.trade.setup==='Rule Break')).length,noTrade=days.filter(d=>['observe','rest'].includes(d.status)||(!d.london.traded&&!d.newyork.traded&&d.note)).length,complete=trades.filter(valid).length;return{keys,days,trades,wins,losses,rr,pnl,aplus,breaks,noTrade,complete}}
function valid(t){return CHECKS.every(([k])=>!!t.checks?.[k])}function stat(a,b,c){return`<div class="stat fade"><small>${a}</small><b>${b}</b><em>${c}</em></div>`}function prog(a,b,c){const p=c?Math.max(0,Math.min(100,Math.round(b/c*100))):0;return`<div class="progress"><div class="meta"><span>${a}</span><b>${p}%</b></div><div class="track"><div class="fill" style="width:${p}%"></div></div></div>`}
function renderDashboard(){const s=monthStats(),score=s.keys.length?Math.round(s.days.length/s.keys.length*100):0,recent=s.keys.slice().reverse().filter(k=>journal.days[k]).slice(0,8);$('#dashboard').innerHTML=`<div class="hero"><div class="card fade"><div class="eyebrow">CURRENT FOCUS</div><h2>Protect the process.</h2><p>Record what actually happened. The journal never asks you to trade just to fill a blank day.</p><div class="focus"><b>Core rule:</b> maximum 1 London + 1 New York trade per day. A++ only. No-trade and rest days are valid.</div></div><div class="card score fade"><div class="ring" style="background:conic-gradient(var(--accent) 0 ${score}%,#32373d ${score}% 100%)"><div><b>${score}%</b><span>journaled days</span></div></div></div></div><div class="stats">${stat('Trades',s.trades.length,`L ${s.keys.filter(k=>journal.days[k]?.london.traded).length} · NY ${s.keys.filter(k=>journal.days[k]?.newyork.traded).length}`)}${stat('A++ days',s.aplus,'complete model')}${stat('Rule breaks',s.breaks,'target: 0')}${stat('No-trade',s.noTrade,'valid observation')}${stat('Wins',s.wins,'closed')}${stat('Net P&L',money(s.pnl),'optional field')}${stat('Net R',s.rr.toFixed(2),'R multiple')}</div><div class="grid2"><div class="card"><div class="titlebar"><b>Execution quality</b><span class="pill">${monthCursor.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</span></div>${prog('A++ days',s.aplus,s.days.length)}${prog('Complete checklists',s.complete,s.trades.length)}${prog('No rule-break days',s.days.length-s.breaks,s.days.length)}${prog('Journaled days',s.days.length,s.keys.length)}</div><div class="card"><div class="titlebar"><b>Recent activity</b><span class="pill">Click to edit</span></div><div class="list">${recent.length?recent.map(k=>activity(k)).join(''):'<div class="note">No journal days yet.</div>'}</div></div></div><div class="card heat"><div class="titlebar"><b>Execution heatmap</b><span class="pill">Last 6 months</span></div><div class="heat-scroll"><div class="heatgrid">${heatmap()}</div></div></div>`;$$('[data-day]').forEach(e=>e.onclick=()=>openDay(e.dataset.day))}
function money(n){return Number(n||0).toLocaleString(undefined,{maximumFractionDigits:2})}function activity(k){const d=journal.days[k],t=[d.london,d.newyork].find(s=>s.traded)?.trade;return`<div class="row" data-day="${k}"><b>${k.slice(5)}</b><div><b>${d.status==='rest'?'Rest':d.status==='observe'?'No Trade':d.london.traded||d.newyork.traded?'Trading':'Unlogged'} · L ${d.london.traded?'✓':'—'} · NY ${d.newyork.traded?'✓':'—'}</b><small>${esc(d.note||d.emotion||'No daily note')}</small></div><span class="${t?.result==='Win'?'good':t?.result==='Loss'?'bad':'warn'}">${t?t.result:'—'}</span></div>`}function heatmap(){let h='';for(let i=181;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i),k=key(d),v=journal.days[k],ts=v?[v.london,v.newyork].filter(s=>s.traded):[],n=ts.length?Math.min(4,Math.max(1,Math.round(ts.reduce((a,s)=>a+Object.values(s.trade.checks||{}).filter(Boolean).length,0)/2.5))):0;h+=`<span class="cell ${n?'l'+n:''}" title="${k}"></span>`}return h}
function renderCalendar(){const y=monthCursor.getFullYear(),m=monthCursor.getMonth(),first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();let h='';for(let i=0;i<first;i++)h+='<div></div>';for(let d=1;d<=days;d++){const k=key(new Date(y,m,d)),x=journal.days[k];h+=`<button class="day ${k===today()?'today':''}" data-day="${k}"><div class="num">${d}</div><div class="mini">${x?x.status==='rest'?'Rest':x.status==='observe'?'No Trade':x.london.traded||x.newyork.traded?'Trading':'Unlogged':'Unlogged'}</div><div class="dots"><i class="dot ${x?.london.traded?(x.london.trade.result==='Loss'?'r':'g'):''}"></i><i class="dot ${x?.newyork.traded?(x.newyork.trade.result==='Loss'?'r':'g'):''}"></i></div><div class="mini">${esc(x?.note||'')}</div></button>`}$('#calendar').innerHTML=`<div class="card calendar fade"><div class="monthbar"><div><div class="eyebrow">MONTHLY JOURNAL</div><div class="monthname">${monthCursor.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</div></div><div class="monthnav"><button class="btn" id="prev">←</button><button class="btn" id="todayM">Today</button><button class="btn" id="next">→</button></div></div><div class="calgrid">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>`<div class="weekday">${x}</div>`).join('')}${h}</div></div>`;$$('[data-day]').forEach(e=>e.onclick=()=>openDay(e.dataset.day));$('#prev').onclick=()=>{monthCursor.setMonth(monthCursor.getMonth()-1);renderAll()};$('#next').onclick=()=>{monthCursor.setMonth(monthCursor.getMonth()+1);renderAll()};$('#todayM').onclick=()=>{monthCursor=new Date(new Date().getFullYear(),new Date().getMonth(),1);renderAll()}}
function renderReview(){const s=monthStats();$('#review').innerHTML=`<div class="reviewgrid"><div class="card"><div class="titlebar"><b>Outcome</b><span class="pill">This month</span></div>${line('Wins',s.wins)}${line('Losses',s.losses)}${line('Trades',s.trades.length)}${line('Net P&L',money(s.pnl))}${line('Net R',s.rr.toFixed(2)+'R')}</div><div class="card"><div class="titlebar"><b>Model adherence</b><span class="pill">Process</span></div>${line('A++ days',s.aplus)}${line('Complete checklists',s.complete)}${line('Rule breaks',s.breaks)}${line('No-trade/rest',s.noTrade)}</div><div class="card"><div class="titlebar"><b>Journal principle</b><span class="pill">Review</span></div><div class="note">Review execution before outcome. Look for early entries, skipped CISD closes, FOMO, revenge trading and trades outside the model.</div></div></div>`}function line(a,b){return`<div class="line"><span>${a}</span><b>${b}</b></div>`}
async function renderSettings(){let s={};try{s=await window.tdt.db.status()}catch{}$('#settings').innerHTML=`<div class="card fade"><div class="titlebar"><b>Data & safety</b><span class="pill">Local-first</span></div><div class="settings-row"><div><b>Journal file</b><p>Survives application updates because it lives outside the executable.</p></div><code class="path">${esc(s.journalPath||'Unavailable')}</code></div><div class="settings-row"><div><b>Backups</b><p>Rolling backups are made before journal overwrite.</p></div><b>${s.backupCount??'—'}</b></div><div class="settings-row"><div><b>Export full journal</b><p>Move this JSON to a new laptop and restore the history.</p></div><button class="btn" id="export">Export JSON</button></div><div class="settings-row"><div><b>Import full journal</b><p>Restore an existing journal or backup file.</p></div><label class="btn">Import JSON<input id="import" type="file" accept=".json" hidden></label></div></div>`;$('#export').onclick=async()=>{const r=await window.tdt.db.exportJson();toast(r.canceled?'Export cancelled.':'Journal exported.')};$('#import').onchange=e=>importBackup(e.target.files?.[0])}
async function importBackup(file){if(!file)return;const r=new FileReader();r.onload=async()=>{try{await window.tdt.db.restore(JSON.parse(r.result));await load();toast('Journal restored.')}catch{alert('Invalid journal backup.')}};r.readAsText(file)}
function openDay(d){currentDate=d;journal.days[d]??=blankDay(d);currentSession='london';editing=false;dirty=false;$('#modalTitle').textContent=dateObj(d).toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'});$('#dayStatus').value=journal.days[d].status||'auto';$('#dayEmotion').value=journal.days[d].emotion||'';$('#dayNote').value=journal.days[d].note||'';$('#dayModal').classList.add('on');$('#saveDay').style.display='none';renderSession()}
function renderSession(){const s=journal.days[currentDate][currentSession];$$('.tab').forEach(t=>t.classList.toggle('active',t.dataset.session===currentSession));if(s.traded&&!editing){const t=s.trade;$('#sessionPanel').innerHTML=`<div class="session"><div class="sessionhead"><b>${currentSession==='london'?'London':'New York'} Session</b><span class="pill good">Saved</span></div><div class="saved"><div class="summary">${sum('Direction',t.direction)}${sum('Grade',t.setup)}${sum('Result',t.result)}${sum('R',t.r)}${sum('P&L',t.pnl)}${sum('Emotion',t.emotion)}</div><div class="savedactions"><span class="hint">Saved trade. Use Edit or Show Full.</span><div><button class="btn small" id="editSession">Edit</button><button class="btn small primary" id="showFull">Show Full</button></div></div></div></div>`;$('#editSession').onclick=()=>{editing=true;dirty=false;$('#saveDay').style.display='inline-block';renderSession()};$('#showFull').onclick=()=>showFull(currentDate,currentSession);return}$('#sessionPanel').innerHTML=`<div class="session"><div class="sessionhead"><b>${currentSession==='london'?'London':'New York'} Session</b><span>Maximum 1 trade</span></div><div class="field"><div class="label">Did you trade?</div><select id="didTrade"><option value="no" ${s.traded?'':'selected'}>No</option><option value="yes" ${s.traded?'selected':''}>Yes</option></select></div>${s.traded?editTrade(s.trade):'<div class="note" style="margin-top:10px">No trade recorded. This is valid. Use the daily note to record what you observed.</div>'}</div>`;$('#didTrade').onchange=()=>{s.traded=$('#didTrade').value==='yes';s.trade=normTrade(s.trade);editing=true;dirty=true;$('#saveDay').style.display='inline-block';renderSession()};if(s.traded)wireTrade(s.trade)}
function sum(a,b){return`<div class="sum"><small>${a}</small><b>${esc(b||'—')}</b></div>`}function editTrade(t){return`<div class="editor"><div class="form"><div class="field"><div class="label">Direction</div><select data-f="direction"><option value="">Select</option><option ${t.direction==='BUY'?'selected':''}>BUY</option><option ${t.direction==='SELL'?'selected':''}>SELL</option></select></div><div class="field"><div class="label">Setup grade</div><select data-f="setup"><option value="">Select</option>${['A++','A+','A','B','Rule Break'].map(v=>`<option ${t.setup===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><div class="label">Result</div><select data-f="result"><option value="">Select</option>${['Win','Loss','BE','Open'].map(v=>`<option ${t.result===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><div class="label">Emotion</div><select data-f="emotion"><option value="">Select</option>${['Calm','Focused','Impatient','Fearful','Greedy','Frustrated','FOMO','Confident','Tired','Distracted'].map(v=>`<option ${t.emotion===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><div class="label">R multiple</div><input data-f="r" type="number" step=".1" value="${esc(t.r)}"></div><div class="field"><div class="label">P&L</div><input data-f="pnl" type="number" step=".01" value="${esc(t.pnl)}"></div><div class="field"><div class="label">Entry</div><input data-f="entry" value="${esc(t.entry)}"></div><div class="field"><div class="label">Stop loss</div><input data-f="sl" value="${esc(t.sl)}"></div><div class="field"><div class="label">Target</div><input data-f="tp" value="${esc(t.tp)}"></div><div class="field full"><div class="label">Trade note</div><textarea data-f="note">${esc(t.note)}</textarea></div><div class="field full"><div class="label">A++ model checklist</div><div class="checks">${CHECKS.map(([k,v])=>`<label class="check"><input type="checkbox" data-c="${k}" ${t.checks[k]?'checked':''}>${v}</label>`).join('')}</div></div></div><div class="shots">${shotBox(t,1)}${shotBox(t,2)}</div></div>`}
function shotBox(t,n){const ref=t['shot'+n];return`<div class="shot"><strong>Screenshot ${n} · ${n===1?'Context / Setup':'Execution / Confirmation'}</strong><p>Stored separately from journal JSON.</p><input type="file" accept="image/png,image/jpeg,image/webp" data-shot="${n}" style="font-size:8px"><div class="shot-preview">${ref?`<img data-shot-ref="${esc(ref)}" src="" alt="Chart screenshot"><button class="remove" data-remove-shot="${n}">Remove</button>`:'<div class="emptyshot">No screenshot attached.</div>'}</div></div>`}
function wireTrade(t){$$('[data-f]').forEach(e=>e.oninput=e.onchange=()=>{t[e.dataset.f]=e.value;dirty=true;$('#saveDay').style.display='inline-block'});$$('[data-c]').forEach(e=>e.onchange=()=>{t.checks[e.dataset.c]=e.checked;dirty=true;$('#saveDay').style.display='inline-block'});$$('[data-shot]').forEach(e=>e.onchange=()=>saveShot(e,t));$$('[data-remove-shot]').forEach(e=>e.onclick=()=>removeShot(e,t));loadShotImages()}
async function saveShot(inp,t){const f=inp.files?.[0];if(!f)return;if(f.size>10*1024*1024){toast('Screenshot must be under 10 MB.');return}const r=new FileReader();r.onload=async()=>{try{const saved=await window.tdt.db.saveScreenshot({dataUrl:r.result});t['shot'+inp.dataset.shot]=saved.filename;dirty=true;$('#saveDay').style.display='inline-block';renderSession();toast('Screenshot saved.')}catch{toast('Screenshot could not be saved.')}};r.readAsDataURL(f)}
async function loadShotImages(){for(const i of $$('[data-shot-ref]')){const ref=i.dataset.shotRef;i.src=ref.startsWith('data:')?ref:(await window.tdt.db.readScreenshot(ref))||'';i.onclick=()=>openViewer(i.src)}}async function removeShot(b,t){const ref=t['shot'+b.dataset.removeShot];if(ref&&!ref.startsWith('data:'))try{await window.tdt.db.deleteScreenshot(ref)}catch{}t['shot'+b.dataset.removeShot]=null;dirty=true;$('#saveDay').style.display='inline-block';renderSession()}
function saveCurrent(){const d=journal.days[currentDate];d.status=$('#dayStatus').value;d.emotion=$('#dayEmotion').value.trim();d.note=$('#dayNote').value.trim();if(d.status==='auto')d.status=d.london.traded||d.newyork.traded?'traded':(d.note||d.emotion)?'observe':'auto';persist().then(()=>{$('#dayModal').classList.remove('on');editing=false})}
function showFull(date,s){const t=journal.days[date][s].trade;$('#fullTitle').textContent=`${dateObj(date).toLocaleDateString()} · ${s==='london'?'London':'New York'}`;$('#fullBody').innerHTML=`<div class="fullinfo">${sum('Direction',t.direction)}${sum('Grade',t.setup)}${sum('Result',t.result)}${sum('Emotion',t.emotion)}${sum('R',t.r)}${sum('P&L',t.pnl)}${sum('Entry',t.entry)}${sum('Stop loss',t.sl)}${sum('Target',t.tp)}</div><div class="card" style="margin-top:14px"><div class="titlebar"><b>Checklist</b><span class="pill">${Object.values(t.checks||{}).filter(Boolean).length}/10</span></div><div class="checks">${CHECKS.map(([k,v])=>`<div class="check">${t.checks[k]?'✓':'○'} ${v}</div>`).join('')}</div></div><div class="card" style="margin-top:14px"><div class="titlebar"><b>Trade note</b></div><div class="note" style="white-space:pre-wrap">${esc(t.note||'No note recorded.')}</div></div><div class="card" style="margin-top:14px"><div class="titlebar"><b>Screenshots</b></div><div class="fullshotgrid">${fullShot(t.shot1,'Context / Setup')}${fullShot(t.shot2,'Execution / Confirmation')}</div></div>`;$('#fullTrade').classList.add('on');loadFullShots()}
function fullShot(ref,label){return`<div class="fullshot"><div class="eyebrow">${label}</div>${ref?`<img data-full-ref="${esc(ref)}" src="" alt="Chart screenshot">`:'<div class="emptyshot">No screenshot attached.</div>'}</div>`}async function loadFullShots(){for(const i of $$('[data-full-ref]')){const ref=i.dataset.fullRef;i.src=ref.startsWith('data:')?ref:(await window.tdt.db.readScreenshot(ref))||'';i.onclick=()=>openViewer(i.src)}}function openViewer(src){if(!src)return;$('#viewerImg').src=src;$('#viewer').classList.add('on')}
function renderAll(){renderDashboardContent();renderCalendar();renderReview()}function renderDashboardContent(){renderDashboard()}function nav(page){$$('.view').forEach(v=>v.classList.remove('on'));$('#'+page).classList.add('on');$$('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#title').textContent={dashboard:'Dashboard',calendar:'Month',review:'Review',settings:'Settings'}[page];if(page==='settings')renderSettings()}
$('#newDay').onclick=()=>openDay(today());$('#backup').onclick=async()=>{const p=await window.tdt.db.backup();toast(p?'Backup created.':'No journal file to back up.')};$('#closeDay').onclick=()=>{if(dirty&&!confirm('Discard unsaved changes?'))return;$('#dayModal').classList.remove('on');dirty=false;editing=false};$('#cancelDay').onclick=()=>{$('#closeDay').click()};$('#saveDay').onclick=saveCurrent;$('#deleteDay').onclick=async()=>{if(confirm('Delete this journal day?')){delete journal.days[currentDate];await persist();$('#dayModal').classList.remove('on')}};$('#closeFull').onclick=()=>$('#fullTrade').classList.remove('on');$('#closeViewer').onclick=()=>$('#viewer').classList.remove('on');$$('.nav button').forEach(b=>b.onclick=()=>nav(b.dataset.page));$$('.tab').forEach(b=>b.onclick=()=>{currentSession=b.dataset.session;editing=false;dirty=false;$('#saveDay').style.display='none';renderSession()});
load();
</script></body></html>
