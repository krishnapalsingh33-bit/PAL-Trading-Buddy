function stat(a,b,c){return`<div class="stat fade"><small>${a}</small><b>${b}</b><em>${c}</em></div>`}function prog(a,b,c){const p=c?Math.round(Math.max(0,Math.min(100,b/c*100))):0;return`<div class="progress"><div class="meta"><span>${a}</span><b>${p}%</b></div><div class="track"><div class="fill" style="width:${p}%"></div></div></div>`}function money(n){return Number(n||0).toLocaleString(undefined,{maximumFractionDigits:2})}function all(){return Object.values(j.days).flatMap(d=>[d.london,d.newyork].filter(s=>s.traded).map(s=>({...s.trade,date:d.date})))}function dstat(d){if(d.status==='rest')return'Rest';if(d.status==='observe')return'No Trade';if(d.status==='break')return'Rule Break';return d.london.traded||d.newyork.traded?'Trading':(d.note||d.emotion)?'No Trade':'Unlogged'}function vtrade(t){return C.every(([a])=>!!t.checks[a])}function stats(keys){const ds=keys.map(x=>j.days[x]).filter(Boolean),ts=ds.flatMap(d=>[d.london,d.newyork]).filter(s=>s.traded).map(s=>s.trade),w=ts.filter(t=>t.result==='Win').length,l=ts.filter(t=>t.result==='Loss').length,p=ts.reduce((n,t)=>n+(Number(t.pnl)||0),0),r=ts.reduce((n,t)=>n+(Number(t.r)||0),0),a=ds.filter(d=>[d.london,d.newyork].some(s=>s.traded&&s.trade.setup==='A++'&&vtrade(s.trade))).length,b=ds.filter(d=>d.status==='break'||[d.london,d.newyork].some(s=>s.trade.setup==='Rule Break')).length,n=ds.filter(d=>['No Trade','Rest'].includes(dstat(d))).length,c=ts.filter(vtrade).length;return{days:ds.length,trades:ts.length,w,l,p,r,a,b,n,c}}
function renderDashboard(){const y=month.getFullYear(),m=month.getMonth(),keys=Array.from({length:new Date(y,m+1,0).getDate()},(_,i)=>k(new Date(y,m,i+1))),s=stats(keys),score=keys.length?Math.round(keys.filter(x=>j.days[x]&&dstat(j.days[x])!=='Rule Break').length/keys.length*100):0,recent=keys.slice().reverse().filter(x=>j.days[x]).slice(0,8);$('#dashboard').innerHTML=`<div class="hero"><div class="card fade"><div class="eyebrow">CURRENT FOCUS</div><h2>Protect the process.</h2><p>Record what actually happened. The journal never asks you to trade just to fill a blank day.</p><div class="focus"><b>Core rule:</b> maximum 1 London + 1 New York trade per day. A++ only. No-trade and rest days are valid.</div></div><div class="card score fade"><div class="ring" style="background:conic-gradient(var(--accent) 0 ${score}%,#32373d ${score}% 100%)"><div><b>${score}%</b><span>monthly clean days</span></div></div></div></div><div class="stats">${stat('Trades',s.trades,`L ${keys.filter(x=>j.days[x]?.london.traded).length} · NY ${keys.filter(x=>j.days[x]?.newyork.traded).length}`)}${stat('A++ days',s.a,'complete model')}${stat('Rule breaks',s.b,'target: 0')}${stat('No-trade',s.n,'valid observation')}${stat('Wins',s.w,'closed')}${stat('Net P&L',money(s.p),'optional field')}${stat('Clean score',score+'%','process quality')}</div><div class="grid2"><div class="card"><div class="titlebar"><b>Execution quality</b><span class="pill">${month.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</span></div>${prog('A++ days',s.a,s.days)}${prog('Complete checklists',s.c,s.trades)}${prog('No rule-break days',s.days-s.b,s.days)}${prog('Journaled days',keys.filter(x=>j.days[x]).length,keys.length)}</div><div class="card"><div class="titlebar"><b>Recent activity</b><span class="pill">Click to edit</span></div><div class="list">${recent.length?recent.map(x=>{const d=j.days[x],t=[d.london,d.newyork].find(z=>z.traded)?.trade;return`<div class="row" data-day="${x}"><b>${x.slice(5)}</b><div><b>${dstat(d)} · L ${d.london.traded?'✓':'—'} · NY ${d.newyork.traded?'✓':'—'}</b><small>${esc(d.note||d.emotion||'No daily note')}</small></div><span class="${t?.result==='Win'?'good':t?.result==='Loss'?'bad':'warn'}">${t?t.result:'—'}</span></div>`}).join(''):'<div class="note">No journal days yet.</div>'}</div></div></div><div class="card heat"><div class="titlebar"><b>Execution heatmap</b><span class="pill">Last 6 months</span></div><div class="heat-scroll"><div class="heatgrid">${heat()}</div></div></div>`;$$('[data-day]').forEach(e=>e.onclick=()=>openDay(e.dataset.day))}
function heat(){let h='';for(let i=181;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i),x=k(d),v=j.days[x],tr=v?[v.london,v.newyork].filter(s=>s.traded):[],n=tr.length?Math.min(4,Math.max(1,Math.round(tr.reduce((a,s)=>a+Object.values(s.trade.checks||{}).filter(Boolean).length,0)/2.5))):0;h+=`<span class="cell ${n?'l'+n:''}" title="${x}"></span>`}return h}function esc(s){return String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]||c))}
function renderCalendar(){const y=month.getFullYear(),m=month.getMonth(),first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();let h='';for(let i=0;i<first;i++)h+='<div></div>';for(let n=1;n<=days;n++){const x=k(new Date(y,m,n)),d=j.days[x];h+=`<button class="day ${x===today()?'today':''}" data-day="${x}"><div class="num">${n}</div><div class="mini">${d?dstat(d):'Unlogged'}</div><div class="dots"><i class="dot ${d?.london.traded?(d.london.trade.result==='Loss'?'r':'g'):''}"></i><i class="dot ${d?.newyork.traded?(d.newyork.trade.result==='Loss'?'r':'g'):''}"></i></div><div class="mini">${esc(d?.note||'')}</div></button>`}$('#calendar').innerHTML=`<div class="card calendar fade"><div class="monthbar"><div><div class="eyebrow">MONTHLY JOURNAL</div><div class="monthname">${month.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</div></div><div class="monthnav"><button class="btn" id="prev">←</button><button class="btn" id="todayM">Today</button><button class="btn" id="next">→</button></div></div><div class="calgrid">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>`<div class="weekday">${x}</div>`).join('')}${h}</div></div>`;$$('#calendar [data-day]').forEach(e=>e.onclick=()=>openDay(e.dataset.day));$('#prev').onclick=()=>{month.setMonth(month.getMonth()-1);renderAll()};$('#next').onclick=()=>{month.setMonth(month.getMonth()+1);renderAll()};$('#todayM').onclick=()=>{month.setFullYear(new Date().getFullYear(),new Date().getMonth(),1);renderAll()}}
function renderReview(){const keys=Array.from({length:new Date(month.getFullYear(),month.getMonth()+1,0).getDate()},(_,i)=>k(new Date(month.getFullYear(),month.getMonth(),i+1))),s=stats(keys);$('#review').innerHTML=`<div class="review-grid"><div class="card"><div class="titlebar"><b>Outcome</b><span class="pill">This month</span></div>${line('Wins',s.w)}${line('Losses',s.l)}${line('Trades',s.trades)}${line('Net P&L',money(s.p))}${line('Net R',s.r.toFixed(2)+'R')}</div><div class="card"><div class="titlebar"><b>Model adherence</b><span class="pill">Process</span></div>${line('A++ days',s.a)}${line('Complete checklists',s.c)}${line('Rule breaks',s.b)}${line('No-trade/rest',s.n)}</div><div class="card"><div class="titlebar"><b>Journal principle</b><span class="pill">Review</span></div><div class="note">Grade execution, not just P&L. Look for early entries, skipped confirmations, FOMO, revenge trading and trades outside the model.</div></div></div>`}function line(a,b){return`<div class="line"><span>${a}</span><b>${b}</b></div>`}
async function renderSettings(){let s={};try{s=await window.tdt.db.status()}catch{}$('#settings').innerHTML=`<div class="card fade"><div class="titlebar"><b>Data & safety</b><span class="pill">Local-first</span></div><div class="settings-row"><div><b>Journal path</b><p>Your journal lives outside the executable and survives app updates.</p></div><code class="codepath">${esc(s.journalPath||'Unavailable')}</code></div><div class="settings-row"><div><b>Backups</b><p>Rolling backups are created before overwrite.</p></div><b>${s.backupCount??'—'}</b></div><div class="settings-row"><div><b>Export full journal</b><p>Use this before moving to a new computer.</p></div><button class="btn" id="export">Export JSON</button></div><div class="settings-row"><div><b>Import full journal</b><p>Restore months of history from a JSON backup.</p></div><label class="btn">Import JSON<input id="import" type="file" accept=".json" hidden></label></div></div>`;$('#export').onclick=async()=>{const r=await window.tdt.db.exportJson();toast(r.canceled?'Export cancelled.':'Journal exported.')};$('#import').onchange=e=>{const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=async()=>{try{await window.tdt.db.restore(JSON.parse(r.result));await load();toast('Journal restored.')}catch{alert('Invalid journal backup.')}};r.readAsText(f)}}
function renderAll(){renderDashboard();renderCalendar();renderReview();if($('#settings').classList.contains('active'))renderSettings()}function renderDashboard(){return renderDashboardImpl()}function renderDashboardImpl(){return renderDashboardReal()}function renderDashboardReal(){renderDashboardBase()}function renderDashboardBase(){const old=$('#dashboard');if(!old)return;renderDashboardContent()}function renderDashboardContent(){const y=month.getFullYear(),m=month.getMonth(),keys=Array.from({length:new Date(y,m+1,0).getDate()},(_,i)=>k(new Date(y,m,i+1))),s=stats(keys),score=keys.length?Math.round(keys.filter(x=>j.days[x]&&dstat(j.days[x])!=='Rule Break').length/keys.length*100):0,recent=keys.slice().reverse().filter(x=>j.days[x]).slice(0,8);$('#dashboard').innerHTML=`<div class="hero"><div class="card fade"><div class="eyebrow">CURRENT FOCUS</div><h2>Protect the process.</h2><p>Record what actually happened. The journal never asks you to trade just to fill a blank day.</p><div class="focus"><b>Core rule:</b> maximum 1 London + 1 New York trade per day. A++ only. No-trade and rest days are valid.</div></div><div class="card score fade"><div class="ring" style="background:conic-gradient(var(--accent) 0 ${score}%,#32373d ${score}% 100%)"><div><b>${score}%</b><span>monthly clean days</span></div></div></div></div><div class="stats">${stat('Trades',s.trades,`L ${keys.filter(x=>j.days[x]?.london.traded).length} · NY ${keys.filter(x=>j.days[x]?.newyork.traded).length}`)}${stat('A++ days',s.a,'complete model')}${stat('Rule breaks',s.b,'target: 0')}${stat('No-trade',s.n,'valid observation')}${stat('Wins',s.w,'closed')}${stat('Net P&L',money(s.p),'optional field')}${stat('Clean score',score+'%','process quality')}</div><div class="grid2"><div class="card"><div class="titlebar"><b>Execution quality</b><span class="pill">${month.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</span></div>${prog('A++ days',s.a,s.days)}${prog('Complete checklists',s.c,s.trades)}${prog('No rule-break days',s.days-s.b,s.days)}${prog('Journaled days',keys.filter(x=>j.days[x]).length,keys.length)}</div><div class="card"><div class="titlebar"><b>Recent activity</b><span class="pill">Click to edit</span></div><div class="list">${recent.length?recent.map(activity).join(''):'<div class="note">No journal days yet.</div>'}</div></div></div><div class="card heat"><div class="titlebar"><b>Execution heatmap</b><span class="pill">Last 6 months</span></div><div class="heat-scroll"><div class="heatgrid">${heat()}</div></div></div>`;$$('[data-day]').forEach(e=>e.onclick=()=>openDay(e.dataset.day))}function activity(x){const d=j.days[x],t=[d.london,d.newyork].find(z=>z.traded)?.trade;return`<div class="row" data-day="${x}"><b>${x.slice(5)}</b><div><b>${dstat(d)} · L ${d.london.traded?'✓':'—'} · NY ${d.newyork.traded?'✓':'—'}</b><small>${esc(d.note||d.emotion||'No daily note')}</small></div><span class="${t?.result==='Win'?'good':t?.result==='Loss'?'bad':'warn'}">${t?t.result:'—'}</span></div>`}
function openDay(x){dateKey=x;const d=j.days[x]||bd(x);j.days[x]=d;sessionEditing=false;dirty=false;sess='london';$('#modalTitle').textContent=D(x).toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'});$('#dayStatus').value=d.status||'auto';$('#dayEmotion').value=d.emotion||'';$('#dayNote').value=d.note||'';$('#dayModal').classList.add('on');$('#saveDay').style.display='none';renderSession()}
function renderSession(){const s=j.days[dateKey][sess];$$('.tab').forEach(t=>t.classList.toggle('active',t.dataset.session===sess));if(s.traded&&!sessionEditing){const t=s.trade;$('#sessionPanel').innerHTML=`<div class="session"><div class="session-head"><b>${sess==='london'?'London':'New York'} Session</b><span class="pill good">Saved</span></div><div class="saved"><div class="summary">${sum('Direction',t.direction)}${sum('Grade',t.setup)}${sum('Result',t.result)}${sum('R',t.r)}${sum('P&L',t.pnl)}${sum('Emotion',t.emotion)}</div><div class="saved-actions"><span class="hint">Saved trade. Use Edit or Show Full.</span><div><button class="btn small" id="editSession">Edit</button><button class="btn small primary" id="fullSession">Show Full</button></div></div></div></div>`;$('#editSession').onclick=()=>{sessionEditing=true;dirty=false;$('#saveDay').style.display='inline-block';renderSession()};$('#fullSession').onclick=()=>openFull(dateKey,sess);return}$('#sessionPanel').innerHTML=`<div class="session"><div class="session-head"><b>${sess==='london'?'London':'New York'} Session</b><span>Maximum 1 trade</span></div><div class="field"><div class="label">Did you trade?</div><select id="didTrade"><option value="no" ${s.traded?'':'selected'}>No</option><option value="yes" ${s.traded?'selected':''}>Yes</option></select></div>${s.traded?editor(s.trade):'<div class="note" style="margin-top:10px">No trade recorded. This is valid. Use the daily note to record what you observed.</div>'}</div>`;$('#didTrade').onchange=()=>{s.traded=$('#didTrade').value==='yes';if(s.traded&&!s.trade)s.trade=bt();sessionEditing=true;dirty=true;$('#saveDay').style.display='inline-block';renderSession()};if(s.traded)wireEditor(s.trade)}
function sum(a,b){return`<div class="sum"><small>${a}</small><b>${esc(b||'—')}</b></div>`}function editor(t){return`<div class="editor"><div class="form"><div class="field"><div class="label">Direction</div><select data-f="direction"><option value="">Select</option><option ${t.direction==='BUY'?'selected':''}>BUY</option><option ${t.direction==='SELL'?'selected':''}>SELL</option></select></div><div class="field"><div class="label">Setup grade</div><select data-f="setup"><option value="">Select</option>${['A++','A+','A','B','Rule Break'].map(v=>`<option ${t.setup===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><div class="label">Result</div><select data-f="result"><option value="">Select</option>${['Win','Loss','BE','Open'].map(v=>`<option ${t.result===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><div class="label">Emotion</div><select data-f="emotion"><option value="">Select</option>${['Calm','Focused','Impatient','Fearful','Greedy','Frustrated','FOMO','Confident','Tired','Distracted'].map(v=>`<option ${t.emotion===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><div class="label">R multiple</div><input data-f="r" type="number" step=".1" value="${esc(t.r)}"></div><div class="field"><div class="label">P&L</div><input data-f="pnl" type="number" step=".01" value="${esc(t.pnl)}"></div><div class="field"><div class="label">Entry</div><input data-f="entry" value="${esc(t.entry)}"></div><div class="field"><div class="label">Stop loss</div><input data-f="sl" value="${esc(t.sl)}"></div><div class="field"><div class="label">Target</div><input data-f="tp" value="${esc(t.tp)}"></div><div class="field full"><div class="label">Trade note</div><textarea data-f="note">${esc(t.note)}</textarea></div><div class="field full"><div class="label">A++ model checklist</div><div class="checks">${C.map(([a,b])=>`<label class="check"><input type="checkbox" data-c="${a}" ${t.checks[a]?'checked':''}>${b}</l function wireEditor(t){$$('[data-f]').forEach(e=>e.oninput=e.onchange=()=>{t[e.dataset.f]=e.value;dirty=true;$('#saveDay').style.display='inline-block'});$$('[data-c]').forEach(e=>e.onchange=()=>{t.checks[e.dataset.c]=e.checked;dirty=true;$('#saveDay').style.display='inline-block'});$$('[data-shot]').forEach(e=>e.onchange=()=>readShot(e));$$('[data-rmshot]').forEach(e=>e.onclick=async()=>{const ref=t['shot'+e.dataset.rmshot];if(ref&&!ref.startsWith('data:'))try{await window.tdt.db.deleteScreenshot(ref)}catch{}t['shot'+e.dataset.rmshot]=null;dirty=true;renderSession()});setTimeout(loadShotImages,0)}async function readShot(inp){const f=inp.files?.[0];if(!f)return;const r=new FileReader();r.onload=async()=>{try{const saved=await window.tdt.db.saveScreenshot({dataUrl:r.result});j.days[dateKey][sess].trade['shot'+inp.dataset.shot]=saved.filename;dirty=true;$('#saveDay').style.display='inline-block';renderSession();toast('Screenshot saved.')}catch{toast('Screenshot could not be saved.')}};r.readAsDataURL(f)}async function loadShotImages(){for(const i of $$('[data-shotimg]')){const ref=i.dataset.shotimg;i.src=ref.startsWith('data:')?ref:(await window.tdt.db.readScreenshot(ref))||'';i.onclick=()=>openViewer(i.src)}}function saveDay(){const d=j.days[dateKey];d.status=$('#dayStatus').value;d.emotion=$('#dayEmotion').value.trim();d.note=$('#dayNote').value.trim();if(d.status==='auto')d.status=d.london.traded||d.newyork.traded?'traded':(d.note||d.emotion)?'observe':'auto';save().then(()=>{$('#dayModal').classList.remove('on');sessionEditing=false})}
function openFull(date,s){const t=j.days[date][s].trade;$('#fullTitle').textContent=`${D(date).toLocaleDateString()} · ${s==='london'?'London':'New York'}`;$('#fullBody').innerHTML=`<div class="full-info">${sum('Direction',t.direction)}${sum('Grade',t.setup)}${sum('Result',t.result)}${sum('Emotion',t.emotion)}${sum('R',t.r)}${sum('P&L',t.pnl)}${sum('Entry',t.entry)}${sum('Stop loss',t.sl)}${sum('Target',t.tp)}</div><div class="card" style="margin-top:14px"><div class="titlebar"><b>Checklist</b><span class="pill">${Object.values(t.checks||{}).filter(Boolean).length}/10</span></div><div class="checks">${C.map(([a,b])=>`<div class="check">${t.checks[a]?'✓':'○'} ${b}</div>`).join('')}</div></div><div class="card" style="margin-top:14px"><div class="titlebar"><b>Trade note</b></div><div class="note" style="white-space:pre-wrap">${esc(t.note||'No note recorded.')}</div></div><div class="card" style="margin-top:14px"><div class="titlebar"><b>Screenshots</b></div><div class="fullshotgrid">${fullShot(t.shot1,'Context / Setup')}${fullShot(t.shot2,'Execution / Confirmation')}</div></div>`;$('#fullTrade').classList.add('on');setTimeout(loadFullShots,0)}function fullShot(ref,label){return`<div class="fullshot"><div class="eyebrow">${label}</div>${ref?`<img data-fullshot="${esc(ref)}" src="" alt="Chart screenshot">`:'<div class="shot-empty" style="margin-top:8px">No screenshot attached.</div>'}</div>`}async function loadFullShots(){for(const i of $$('[data-fullshot]')){const ref=i.dataset.fullshot;i.src=ref.startsWith('data:')?ref:(await window.tdt.db.readScreenshot(ref))||'';i.onclick=()=>openViewer(i.src)}}function openViewer(src){if(!src)return;$('#viewerImg').src=src;$('#viewer').classList.add('on')}function toast(m){$('#toast').textContent=m;$('#toast').classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>$('#toast').classList.add('hidden'),1900)}function closeDay(){if(dirty&&!confirm('Discard unsaved changes?'))return;$('#dayModal').classList.remove('on');dirty=false;sessionEditing=false}function nav(v){$$('.view').forEach(x=>x.classList.remove('active'));$('#'+v).classList.add('active');$$('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===v));$('#title').textContent={dashboard:'Dashboard',calendar:'Month',review:'Review',settings:'Settings'}[v];if(v==='settings')renderSettings()}
$('#newDay').onclick=()=>openDay(today());$('#backup').onclick=async()=>{const p=await window.tdt.db.backup();toast(p?'Backup created.':'No journal file to back up.')}$('#closeDay').onclick=closeDay;$('#cancelDay').onclick=closeDay;$('#saveDay').onclick=saveDay;$('#deleteDay').onclick=async()=>{if(confirm('Delete this journal day?')){delete j.days[dateKey];await save();$('#dayModal').classList.remove('on')}}$('#closeFull').onclick=()=>$('#fullTrade').classList.remove('on');$('#closeViewer').onclick=()=>$('#viewer').classList.remove('on');$$('.nav button').forEach(b=>b.onclick=()=>nav(b.dataset.view));$$('.tab').forEach(b=>b.onclick=()=>{sess=b.dataset.session;sessionEditing=false;dirty=false;$('#saveDay').style.display='none';renderSession()});
